<script>

function buildCommerceTabs(){

  panel('crm').innerHTML=`<div class="sectionHead"><div><div class="eyebrow">SALES PIPELINE</div><h2>Leads &amp; follow-ups</h2></div><button type="button" class="secondary" id="refreshCrm">Refresh</button></div><div class="statsGrid crmStats"><article class="glass stat"><span>OPEN LEADS</span><strong id="crmOpenCount">0</strong></article><article class="glass stat"><span>DUE / OVERDUE</span><strong id="crmDueCount">0</strong></article><article class="glass stat"><span>FOLLOW-UPS NEXT 7 DAYS</span><strong id="crmUpcomingCount">0</strong></article></div><form id="crmLeadForm" class="glass form crmForm"><h3 id="crmFormTitle">Add a lead</h3><input type="hidden" name="leadId"><div class="formRow"><label>Company / contact<input name="company" maxlength="160" required></label><label>Contact person<input name="contact" maxlength="120"></label></div><div class="formRow"><label>Phone<input name="phone" type="tel" maxlength="40" placeholder="Include country code for WhatsApp"></label><label>Email<input name="email" type="email" maxlength="160"></label></div><div class="formRow"><label>Product / service interest<input name="product" maxlength="120" placeholder="CCTV, AMC, UPS…"></label><label>Lead source<input name="source" maxlength="80" placeholder="Referral, enquiry, event…"></label></div><div class="formRow"><label>Sales stage<select name="stage"><option>New</option><option>Contacted</option><option>Qualified</option><option>Quote sent</option><option>Won</option><option>Lost</option></select></label><label class="${ctx.manager?'':'hidden'}">Assigned employee<select name="employeeId" id="crmEmployee"><option value="">Unassigned</option></select></label></div><div class="formRow"><label>Next follow-up date<input name="followUpDate" type="date" required></label><label>Next action<input name="nextAction" maxlength="180" required placeholder="Call to confirm site visit"></label></div><div class="formRow"><label>Last contacted<input name="lastContact" type="date"></label><label>Notes<textarea name="notes" maxlength="1000" placeholder="Need, quote, discussion summary"></textarea></label></div><div class="formRow"><button class="primary" type="submit">Save lead <span>↗</span></button><button class="secondary hidden" type="button" id="cancelCrmEdit">Cancel edit</button></div><div id="crmLeadMsg" class="note" role="status"></div></form><div class="sectionHead"><div><div class="eyebrow">ACTION LIST</div><h2>Follow-ups to work</h2></div></div><div id="crmLeadList" class="recordList"></div><section class="glass form crmReminderSetup"><h3>Daily internal reminders</h3><p>At 9 AM Apps Script project time, the app emails assigned staff and managers about open leads whose follow-up date is due. It does not send messages to customers.</p>${ctx.manager?'<button type="button" class="secondary" id="enableLeadReminders">Enable daily lead reminders</button>':''}<div id="crmReminderMsg" class="note" role="status"></div></section>`;
  move('overview',$('commerceSkuCount').closest('.statsGrid'),before($('commerceLowStock')),$('commerceLowStock'),before($('commerceProducts')),$('commerceProducts'),before($('commerceMovements')),$('commerceMovements'),before($('commerceInvoices')),$('commerceInvoices'),$('commerceInvoicePreview'));
  move('stockIn',$('scanStockButton').closest('.sectionHead'),$('supplierBillFile').closest('.billOcr'),$('stockInForm'));
  move('stockOut',before($('stockOutForm')),$('stockOutForm'),before($('invoiceForm')),$('invoiceForm'));
  const tools=$('commerceManagerTools');tools.classList.remove('hidden');
  move('catalog',$('commerceSettingsForm'),$('productForm'));
  const partyWrap=tools.querySelector('.commerceParties'),partyBlocks=partyWrap?[...partyWrap.children]:[];

async function initCommerce(){
  buildCommerceTabs();
  $('commerceTab').classList.remove('hidden');
  if(ctx.manager)await loadCommerceAccess();
  await refreshCommerce();
}
function bindCrm(){
  const form=$('crmLeadForm');form.elements.stage.addEventListener('change',()=>{const closed=['Won','Lost'].includes(form.elements.stage.value);form.elements.followUpDate.required=!closed;form.elements.nextAction.required=!closed});
  form.onsubmit=async ev=>{ev.preventDefault();if(!form.reportValidity())return;const b=form.querySelector('[type="submit"]');b.disabled=true;b.classList.add('is-busy');try{await rpc('appCommerceSaveLead',token,Object.fromEntries(new FormData(form).entries()));resetCrmForm();await refreshCommerce();msg('crmLeadMsg','Lead saved. Follow-up is on your action list.');toast('Lead saved')}catch(e){msg('crmLeadMsg',e.message||'Could not save this lead.')}finally{b.disabled=false;b.classList.remove('is-busy')}};
  $('cancelCrmEdit').onclick=resetCrmForm;$('refreshCrm').onclick=refreshCommerce;
  if($('enableLeadReminders'))$('enableLeadReminders').onclick=async()=>{const b=$('enableLeadReminders');b.disabled=true;try{const r=await rpc('appManagerEnableLeadReminders',token);msg('crmReminderMsg',r.message);toast('Lead reminders enabled')}catch(e){msg('crmReminderMsg',e.message||'Could not enable lead reminders.')}finally{b.disabled=false}};
  form.addEventListener('input',()=>{if(form.elements.leadId.value)$('crmFormTitle').textContent='Edit lead'});
}
function resetCrmForm(){const f=$('crmLeadForm');f.reset();f.elements.leadId.value='';if(ctx.manager)f.elements.employeeId.value='';f.elements.followUpDate.required=true;f.elements.nextAction.required=true;$('crmFormTitle').textContent='Add a lead';$('cancelCrmEdit').classList.add('hidden');msg('crmLeadMsg','')}
function crmDate(value){return String(value||'').slice(0,10)}
function crmToday(){const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)}
function renderCrmLeads(){
  const leads=commerceData.leads||[],today=crmToday(),week=new Date(today+'T12:00:00');week.setDate(week.getDate()+7);const weekEnd=week.toISOString().slice(0,10),open=leads.filter(x=>!['Won','Lost'].includes(String(x.Stage))),due=open.filter(x=>crmDate(x['Next Follow-up Date'])<=today),upcoming=open.filter(x=>crmDate(x['Next Follow-up Date'])>today&&crmDate(x['Next Follow-up Date'])<=weekEnd);
  if($('crmOpenCount'))$('crmOpenCount').textContent=String(open.length);if($('crmDueCount'))$('crmDueCount').textContent=String(due.length);if($('crmUpcomingCount'))$('crmUpcomingCount').textContent=String(upcoming.length);

}
async function refreshCommerce(){
  if(!token||!ctx||!ctx.commerce)return;
  try{
    commerceData=await rpc('appCommerceGetData',token);
    $('commerceSkuCount').textContent=commerceData.products.length;
    $('commerceLowCount').textContent=commerceData.lowStock.length;
    $('commerceCustomerCount').textContent=commerceData.customers.length;
    $('commerceVendorCount').textContent=commerceData.vendors.length;
    $('stockOutProduct').innerHTML='<option value="">Choose product…</option>'+commerceData.products.map(p=>`<option value="${esc(p.SKU)}">${esc(p.Product)} · stock ${Number(p.Stock)||0}</option>`).join('');
    if(ctx.manager&&commerceData.settings){const f=$('commerceSettingsForm');f.elements.companyName.value=commerceData.settings.companyName||'';f.elements.address.value=commerceData.settings.address||'';f.elements.contact.value=commerceData.settings.contact||'';f.elements.gstin.value=commerceData.settings.gstin||'';}
    const productOptions='<option value="">Choose product…</option>'+commerceData.products.map(p=>`<option value="${esc(p.SKU)}">${esc(p.Product)} · ${esc(p.SKU)} · stock ${Number(p.Stock)||0}</option>`).join('');
    $('stockProduct').innerHTML=productOptions;
    $('invoiceProduct').innerHTML=productOptions;
    const vendorOptions='<option value="">Choose vendor (optional)…</option>'+commerceData.vendors.map(v=>`<option value="${esc(v['Vendor ID'])}">${esc(v['Vendor Name'])}</option>`).join('');
    $('stockVendor').innerHTML=vendorOptions;
    $('productVendor').innerHTML='<option value="">No preferred vendor</option>'+commerceData.vendors.map(v=>`<option value="${esc(v['Vendor ID'])}">${esc(v['Vendor Name'])}</option>`).join('');
    $('invoiceCustomer').innerHTML='<option value="">Choose customer…</option>'+commerceData.customers.map(c=>`<option value="${esc(c['Customer ID'])}">${esc(c['Customer Name'])}${c.GSTIN?' · '+esc(c.GSTIN):''}</option>`).join('');
    $('commerceLowStock').innerHTML=commerceData.lowStock.length?commerceData.lowStock.map(p=>`<article class="record lowStock"><div><strong>${esc(p.Product)} · ${esc(p.SKU)}</strong><span>Stock ${Number(p.Stock)||0} · reorder at ${Number(p['Reorder Level'])||0}${p.PreferredVendor?' · preferred vendor: '+esc(p.PreferredVendor):' · no preferred vendor set'}</span></div><span class="tag">Restock</span></article>`).join(''):'<article class="record"><span>No products are below their reorder threshold.</span></article>';
    $('commerceProducts').innerHTML=commerceData.products.length?commerceData.products.map(p=>`<article class="record"><div><strong>${esc(p.Product)} · ${esc(p.SKU)}</strong><span>Barcode ${esc(p.Barcode||'—')} · MRP ₹${Number(p.MRP||0).toFixed(2)} · sell ₹${Number(p['Selling Price']||0).toFixed(2)} · GST ${Number(p['GST %']||0)}%</span>${p.PreferredVendor?`<span>Preferred vendor: ${esc(p.PreferredVendor)}</span>`:''}</div><span class="tag">${Number(p.Stock)||0} in stock</span></article>`).join(''):'<article class="record"><span>Managers can add the first item in Catalog and access settings.</span></article>';
    if(ctx.manager)$('commerceVendorList').innerHTML=commerceData.vendors.map(v=>`<article class="record"><div><strong>${esc(v['Vendor Name'])}</strong><span>${esc(v.GSTIN||'No GSTIN')} · ${esc(v.Phone||'')} · ${esc(v.Email||'')}</span><span>${esc(v.Address||'')}</span></div></article>`).join('')||'<article class="record"><span>No vendors added.</span></article>'; $('commerceCustomerList').innerHTML=commerceData.customers.map(c=>`<article class="record"><div><strong>${esc(c['Customer Name'])}</strong><span>${esc(c.Phone||'No mobile')} · ${esc(c.Email||'No email')} · ${esc(c.GSTIN||'No GSTIN')}</span><span>${esc(c.Address||'')}</span></div></article>`).join('')||'<article class="record"><span>No clients added yet. Add a client above or create one while preparing a bill.</span></article>';
    $('commerceMovements').innerHTML=commerceData.movements.length?commerceData.movements.map(m=>`<article class="record"><div><strong>${m.Type==='IN'?'Stock received':'Stock issued / sold'} · ${esc(m.Product)}</strong><span>${esc(m.Timestamp)} · ${esc(m['Party Name']||m['Reference']||m.Notes||'—')} · by ${esc(m['Created By'])}</span></div><span class="tag">${m.Type==='IN'?'+':'−'}${Number(m.Quantity)||0}</span></article>`).join(''):'<article class="record"><span>No stock movements recorded.</span></article>';
    $('commerceInvoices').innerHTML=commerceData.invoices.length?commerceData.invoices.map(i=>`<article class="record"><div><strong>${esc(i['Invoice Number'])} · ${esc(i['Customer Name'])}</strong><span>${esc(i.Timestamp)} · Total ₹${Number(i['Grand Total']||0).toFixed(2)}</span></div><button type="button" class="secondary" data-commerce-invoice="${esc(i['Invoice ID'])}">Open bill</button></article>`).join(''):'<article class="record"><span>No bills have been created.</span></article>';
    document.querySelectorAll('[data-commerce-invoice]').forEach(b=>b.onclick=()=>openCommerceInvoice(b.dataset.commerceInvoice));
    renderInvoiceCart();
    renderCrmLeads();
  }catch(e){$('commerceProducts').innerHTML=`<article class="record"><span>${esc(e.message||'Could not load stock data.')}</span></article>`}
}
function productByBarcode(code){const q=String(code||'').trim();return commerceData.products.find(p=>String(p.Barcode||'').trim()===q||String(p.SKU||'').toUpperCase()===q.toUpperCase())}
function resolveScan(code){const p=productByBarcode(code);if(!p){msg('commerceScannerMsg','No product matches “'+String(code).slice(0,80)+'”. Add this barcode to the item in Catalog, or enter the SKU manually.');return false}if(scanTarget==='stock'){ $('stockProduct').value=p.SKU;msg('commerceScannerMsg','Scanned '+p.Product+'. Enter received quantity and save to add it to stock.')}else{$('invoiceProduct').value=p.SKU;$('invoiceQuantity').focus();msg('commerceScannerMsg','Scanned '+p.Product+'. Add it to the bill.')}return true}
function loadZXing(){if(window.ZXingBrowser)return Promise.resolve(window.ZXingBrowser);if(zxingPromise)return zxingPromise;zxingPromise=new Promise((resolve,reject)=>{const script=document.createElement('script');script.src='https://unpkg.com/@zxing/browser@0.1.5';script.async=true;script.onload=()=>window.ZXingBrowser?resolve(window.ZXingBrowser):reject(Error('Barcode scanner library did not initialize.'));script.onerror=()=>{zxingPromise=null;reject(Error('Could not load the barcode scanner. Check internet access and try again.'))};document.head.appendChild(script)});return zxingPromise}
async function startCommerceScan(target){if(scanStream||scannerControls){stopCommerceScan();msg('commerceScannerMsg','Scanner stopped.');return}scanTarget=target;scannerButton=$(target==='stock'?'scanStockButton':'scanInvoiceButton');scannerButtonLabel=scannerButton.textContent;scannerButton.textContent='Starting camera…';scannerButton.classList.add('is-busy');const video=$('commerceScanner'),status=$('commerceScannerMsg');const anchor=scannerButton.closest('.sectionHead')||scannerButton.parentElement;anchor.insertAdjacentElement('afterend',video);video.insertAdjacentElement('afterend',status);video.classList.remove('hidden');video.scrollIntoView({behavior:'smooth',block:'center'});msg('commerceScannerMsg','Requesting camera permission…');if(!navigator.mediaDevices?.getUserMedia){msg('commerceScannerMsg','Camera access is unavailable here. Open the app in Chrome over HTTPS, allow camera access, or enter the barcode manually.');restoreScannerButton_();return}try{let detector=null;if('BarcodeDetector'in window){try{const supported=await BarcodeDetector.getSupportedFormats(),formats=['ean_13','ean_8','upc_a','upc_e','code_128','code_39','qr_code'].filter(f=>supported.includes(f));if(formats.length)detector=new BarcodeDetector({formats})}catch(_){}}
  if(detector){scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});video.srcObject=scanStream;await video.play();scannerButton.textContent='Stop scanning';scannerButton.classList.remove('is-busy');msg('commerceScannerMsg','Camera is on. Point it at the barcode and hold steady. Tap Stop scanning when finished.');const scan=async()=>{if(!scanStream)return;try{const codes=await detector.detect(video);if(codes.length){resolveScan(codes[0].rawValue);stopCommerceScan();return}}catch(_){}requestAnimationFrame(scan)};requestAnimationFrame(scan);return}
  const ZX=await loadZXing();const reader=new ZX.BrowserMultiFormatReader();let found=false;msg('commerceScannerMsg','Camera is starting. Keep the barcode inside the preview.');const controls=await reader.decodeFromVideoDevice(undefined,video,(result,error)=>{if(result){found=true;resolveScan(result.getText());stopCommerceScan()}});if(found){controls.stop();restoreScannerButton_()}else{scannerControls=controls;scannerButton.textContent='Stop scanning';scannerButton.classList.remove('is-busy');msg('commerceScannerMsg','Camera is on. Hold the barcode inside the preview. Tap Stop scanning when finished.')}
}catch(e){stopCommerceScan();msg('commerceScannerMsg',(e&&e.name==='NotAllowedError'?'Camera permission was denied. Allow camera access for this site and try again.':e&&e.name==='NotFoundError'?'No camera was found. Enter the barcode manually.':(e.message||'Camera scan could not start. Enter the barcode manually.')))}}
function restoreScannerButton_(){if(scannerButton){scannerButton.textContent=scannerButtonLabel||'Scan product label';scannerButton.classList.remove('is-busy');scannerButton.disabled=false}scannerButton=null}
function stopCommerceScan(){if(scannerControls){try{scannerControls.stop()}catch(_){}scannerControls=null}if(scanStream)scanStream.getTracks().forEach(t=>t.stop());scanStream=null;const video=$('commerceScanner');if(video){video.pause();video.srcObject=null;video.classList.add('hidden')}restoreScannerButton_()}
$('scanStockButton').onclick=()=>startCommerceScan('stock');$('scanInvoiceButton').onclick=()=>startCommerceScan('invoice');
$('readSupplierBill').onclick=async()=>{const b=$('readSupplierBill'),f=$('supplierBillFile').files[0];if(!f){msg('billOcrMsg','First choose or photograph a supplier bill.');$('supplierBillFile').focus();return}if(f.size>5*1024*1024){msg('billOcrMsg','Choose a file no larger than 5 MB.');return}b.disabled=true;b.classList.add('is-busy');b.textContent='Reading bill…';msg('billOcrMsg','Reading bill text. This may take a few seconds; keep this page open.');$('billOcrMsg').scrollIntoView({behavior:'smooth',block:'center'});try{const data=f.type==='application/pdf'?await fileDataUrl(f):await imageData(f,1800),r=await rpc('appCommerceReadSupplierBill',token,data,f.name);$('billOcrText').value=r.text||'';if(r.invoiceReference)$('stockInForm').elements.reference.value=r.invoiceReference;if(r.gstins&&r.gstins.length){const vendor=commerceData.vendors.find(v=>String(v.GSTIN||'').toUpperCase()===r.gstins[0]);if(vendor)$('stockVendor').value=vendor['Vendor ID']}msg('billOcrMsg',r.text?'Text extracted. Review the text, then choose product, quantity, and vendor below and save stock receipt. '+(r.gstins&&r.gstins.length?'GSTIN found: '+r.gstins.join(', '):'No GSTIN candidate found.'):'No readable text was found. Try a clearer, brighter photo or enter the details manually.');}catch(e){msg('billOcrMsg',e.message||'Could not read this supplier bill.')}finally{b.disabled=false;b.classList.remove('is-busy');b.textContent='Read bill text'}};
function fileDataUrl(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result));reader.onerror=()=>reject(Error('Could not read the selected file.'));reader.readAsDataURL(file)})}
$('stockBarcode').addEventListener('change',()=>{const p=productByBarcode($('stockBarcode').value);if(p){$('stockProduct').value=p.SKU;msg('commerceScannerMsg','Matched '+p.Product+'.')}});

$('refreshCommerce').onclick=refreshCommerce;
$('stockInForm').onsubmit=async ev=>{ev.preventDefault();const form=ev.currentTarget,b=ev.submitter;b.disabled=true;b.classList.add('is-busy');try{await rpc('appCommerceStockIn',token,Object.fromEntries(new FormData(form).entries()));form.reset();await refreshCommerce();msg('stockInMsg','Received quantity added to stock and recorded in movement history.');toast('Stock received')}catch(e){msg('stockInMsg',e.message||'Stock receipt failed.')}finally{b.disabled=false;b.classList.remove('is-busy')}};
$('stockOutForm').onsubmit=async ev=>{ev.preventDefault();const form=ev.currentTarget,b=ev.submitter;b.disabled=true;try{await rpc('appCommerceStockOut',token,Object.fromEntries(new FormData(form).entries()));form.reset();await refreshCommerce();msg('stockOutMsg','Stock issue saved in movement history.');toast('Stock issue recorded')}catch(e){msg('stockOutMsg',e.message||'Could not record stock issue.')}finally{b.disabled=false}};
$('addInvoiceLine').onclick=()=>{const sku=$('invoiceProduct').value,p=commerceData.products.find(x=>String(x.SKU)===sku),qty=Number($('invoiceQuantity').value);if(!p){msg('invoiceMsg','Choose or scan a product first.');return}if(!Number.isInteger(qty)||qty<1){msg('invoiceMsg','Enter a positive whole-number quantity.');return}const available=Number(p.Stock)||0,existing=invoiceCart.find(x=>x.sku===sku),next=(existing?existing.quantity:0)+qty;if(next>available){msg('invoiceMsg',`Only ${available} ${p.Product} are in stock.`);return}if(existing)existing.quantity=next;else invoiceCart.push({sku:p.SKU,quantity:qty});$('invoiceBarcode').value='';$('invoiceQuantity').value=1;msg('invoiceMsg','');renderInvoiceCart()};
function renderInvoiceCart(){$('invoiceCart').innerHTML=invoiceCart.length?invoiceCart.map((x,i)=>{const p=commerceData.products.find(y=>y.SKU===x.sku)||{};return `<article class="record"><div><strong>${esc(p.Product||x.sku)}</strong><span>${esc(x.sku)} · ${x.quantity} × ₹${Number(p['Selling Price']||0).toFixed(2)} · GST ${Number(p['GST %']||0)}%</span></div><button type="button" class="secondary" data-remove-invoice-line="${i}">Remove</button></article>`}).join(''):'<article class="record"><span>Scan or select products, then add them to this bill.</span></article>';document.querySelectorAll('[data-remove-invoice-line]').forEach(b=>b.onclick=()=>{invoiceCart.splice(Number(b.dataset.removeInvoiceLine),1);renderInvoiceCart()})}
function newInvoiceRequestId(){if(window.crypto&&crypto.randomUUID)return crypto.randomUUID();return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==='x'?r:(r&3|8)).toString(16)})}
$('invoiceForm').onsubmit=async ev=>{ev.preventDefault();const form=ev.currentTarget;if(!invoiceCart.length){msg('invoiceMsg','Add at least one product to the bill.');return}if(!form.dataset.requestId)form.dataset.requestId=newInvoiceRequestId();const b=ev.submitter;b.disabled=true;b.classList.add('is-busy');msg('invoiceMsg','Creating invoice PDF and recording stock movement…');try{const result=await rpc('appCommerceCreateInvoice',token,{requestId:form.dataset.requestId,customerId:$('invoiceCustomer').value,items:invoiceCart});commercePdfPreview(result.fileName,result.pdfBase64);invoiceCart=[];form.reset();form.dataset.requestId='';await refreshCommerce();msg('invoiceMsg',`Bill ${result.invoiceNumber} saved. ₹${Number(result.total).toFixed(2)} total.`);toast('Bill created · stock deducted')}catch(e){msg('invoiceMsg',e.message||'Could not create the bill. Retry safely without duplicating a saved invoice.')}finally{b.disabled=false;b.classList.remove('is-busy')}};
function commercePdfPreview(name,b64){const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0)),blob=new Blob([bytes],{type:'application/pdf'});if(window.commercePdfUrl)URL.revokeObjectURL(window.commercePdfUrl);window.commercePdfUrl=URL.createObjectURL(blob);$('commercePdfFrame').src=window.commercePdfUrl;$('commercePdfName').textContent=name;$('commerceInvoicePreview').classList.remove('hidden');$('commerceInvoicePreview').scrollIntoView({behavior:'smooth',block:'start'})}
async function openCommerceInvoice(id){try{const r=await rpc('appCommerceGetInvoicePdf',token,id);commercePdfPreview(r.fileName,r.pdfBase64)}catch(e){toast(e.message||'Could not open the invoice.')}}
async function saveCommerceParty(kind,formId,msgId){const form=$(formId),b=form.querySelector('button[type="submit"],button:not([type])');b.disabled=true;try{await rpc('appCommerceSaveParty',token,kind,Object.fromEntries(new FormData(form).entries()));form.reset();msg(msgId,kind==='VENDOR'?'Vendor saved.':'Customer saved.');await refreshCommerce();toast(kind==='VENDOR'?'Vendor saved':'Customer saved')}catch(e){msg(msgId,e.message||'Could not save.')}finally{b.disabled=false}}
$('productForm').onsubmit=async ev=>{ev.preventDefault();const b=ev.submitter;b.disabled=true;try{await rpc('appCommerceSaveProduct',token,Object.fromEntries(new FormData(ev.currentTarget).entries()));ev.currentTarget.reset();await refreshCommerce();msg('productMsg','Product saved. Scan lookup and stock totals are ready.');toast('Product saved')}catch(e){msg('productMsg',e.message||'Could not save the product.')}finally{b.disabled=false}};
$('commerceSettingsForm').onsubmit=async ev=>{ev.preventDefault();const b=ev.submitter;b.disabled=true;try{const settings=await rpc('appCommerceSaveSettings',token,Object.fromEntries(new FormData(ev.currentTarget).entries()));ev.currentTarget.elements.companyName.value=settings.companyName;msg('commerceSettingsMsg','Company bill details saved.');toast('Company settings saved')}catch(e){msg('commerceSettingsMsg',e.message||'Could not save company details.')}finally{b.disabled=false}};
$('printCommerceInvoice').onclick=()=>{try{$('commercePdfFrame').contentWindow.print()}catch(_){if(window.commercePdfUrl)window.open(window.commercePdfUrl,'_blank')}};
$('vendorForm').onsubmit=ev=>{ev.preventDefault();saveCommerceParty('VENDOR','vendorForm','vendorMsg')};$('customerForm').onsubmit=ev=>{ev.preventDefault();saveCommerceParty('CUSTOMER','customerForm','customerMsg')};
$('invoiceNewClientForm').onsubmit=async ev=>{ev.preventDefault();const f=ev.currentTarget,b=f.querySelector('button');b.disabled=true;try{const r=await rpc('appCommerceSaveParty',token,'CUSTOMER',Object.fromEntries(new FormData(f).entries()));await refreshCommerce();$('invoiceCustomer').value=r.id;f.reset();f.closest('details').open=false;msg('invoiceMsg','New client saved to the shared register and selected for this bill.');toast('Client saved and selected')}catch(e){msg('invoiceNewClientMsg',e.message||'Could not save client.')}finally{b.disabled=false}};
async function loadCommerceAccess(){try{const rows=await rpc('appManagerGetCommerceAccess',token);commerceEmployees=rows;$('crmEmployee').innerHTML='<option value="">Unassigned</option>'+rows.map(e=>`<option value="${esc(e.id)}">${esc(e.name)}</option>`).join('');$('commerceAccessList').innerHTML=rows.map(e=>`<label class="commercePermission"><span><strong>${esc(e.name)}</strong><small>${esc(e.email||'No email set')}</small></span><input type="checkbox" data-commerce-access="${esc(e.id)}" ${e.access?'checked':''} ${!e.email?'disabled':''} aria-label="Grant CRM and stock access to ${esc(e.name)}"></label>`).join('')||'<article class="record"><span>No active employees found.</span></article>';document.querySelectorAll('[data-commerce-access]').forEach(c=>c.onchange=async()=>{c.disabled=true;try{const r=await rpc('appManagerSetCommerceAccess',token,c.dataset.commerceAccess,c.checked);msg('commerceAccessMsg',r.access?'Access granted.':'Access removed.')}catch(e){c.checked=!c.checked;msg('commerceAccessMsg',e.message||'Could not update access.')}finally{c.disabled=false}})}catch(e){msg('commerceAccessMsg',e.message||'Could not load employee access.')}}
document.querySelector('[data-view="commerce"]')?.addEventListener('click',()=>refreshCommerce());
</script>
