<script>
const $=id=>document.getElementById(id);let token='',profile=null,ctx=null,myData=null,employees=[];const SESSION_KEY='rushabhWorkdaySessionV1',IDLE_LIMIT=8*60*60*1000;let idleTimer=null,lastServerPing=0,activityBound=false;
function rpc(fn,...args){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error((e&&e.message)||'Request failed')))[fn](...args))}
function msg(id,text){$(id).textContent=text||''}function toast(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2500)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}let otpRequested=false;
$('loginBtn').onclick=async()=>{const b=$('loginBtn'),email=$('email').value.trim(),verifying=otpRequested;if(!email){msg('loginMsg','Enter your registered work email.');return}b.disabled=true;if(!verifying){$('otpWrap').classList.remove('hidden');$('otp').value='';msg('loginMsg','Sending sign-in code…');b.textContent='Sending code…'}try{if(verifying){const r=await rpc('appVerifyOtp',email,$('otp').value);token=r.token;profile=r.profile;otpRequested=false;saveSession();startSessionTracking();await enterApp()}else{const r=await rpc('appRequestOtp',email);msg('loginMsg',r.message||'Check your email for the six-digit code.');if(r.ok){otpRequested=true;b.innerHTML='Verify and sign in <span>↗</span>';$('otp').focus()}else{b.innerHTML='Send sign-in code <span>↗</span>'}}}catch(e){msg('loginMsg',e.message||'Could not reach sign-in service. Try again.');if(!verifying)b.innerHTML='Retry sign-in code <span>↗</span>'}finally{b.disabled=false}};
async function enterApp(){ctx=await rpc('appGetContext',token);$('login').classList.add('hidden');$('workspace').classList.remove('hidden');$('headRight').innerHTML='<span class="pill">'+esc(profile.role)+'</span>';$('nameLabel').textContent=profile.name.split(' ')[0]+'.';$('roleLabel').textContent=profile.role.toUpperCase()+' · TODAY';$('dateLabel').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});if(ctx.manager){$('managerTab').classList.remove('hidden');await loadEmployees();await refreshDashboard();await refreshTeamSchedules();await refreshTasks();await refreshRequests();await refreshWeeklyReport()}await refreshMine();await refreshMySchedule();await refreshMyTasks();await refreshMyRequests()}
async function refreshMine(){myData=await rpc('appGetMyData',token);const today=myData.today,att=myData.attendance.filter(r=>String(r['Work Date']).slice(0,10)===today);const i=att.find(r=>r.Event==='CHECK_IN'),o=att.find(r=>r.Event==='CHECK_OUT');$('attendanceState').textContent=o?'Day complete':i?'Checked in':'Not checked in';$('inTime').textContent=i?'Recorded '+i['Server Timestamp']:'';$('outTime').textContent=o?'Recorded '+o['Server Timestamp']:'';$('inBtn').disabled=!!i;$('outBtn').disabled=!i||!!o;$('myRecords').innerHTML=recordMarkup(myData.attendance.slice(0,12),'attendance');$('myProgress').innerHTML=recordMarkup(myData.progress.slice(0,12),'progress')}
function recordMarkup(rows,type){if(!rows.length)return '<div class="record"><span>No records yet.</span></div>';return rows.map(r=>{const title=type==='attendance'?String(r.Event||'').replace('_',' '):(r['Project / Client']||'Daily progress');const text=type==='attendance'?`${r['Server Timestamp']} · ${r['Office Distance M']} m from office`:`${r['Work Summary']} · ${r.Status} · ${r.Hours}h`;const more=type==='progress'?[['Blockers',r.Blockers],['Support needed',r['Support Needed']],['Next day plan',r['Next Day Plan']],['Work location',r['Work Location']],['Priority',r.Priority],['Additional work',r['Additional Work']],['New skills',r['New Skills']]].filter(x=>x[1]).map(x=>`<span>${esc(x[0])}: ${esc(x[1])}</span>`).join(''):'';return `<article class="record"><div><strong>${esc(title)}</strong><span>${esc(text)}</span>${more}</div><span class="tag">${esc(r['Work Date']||'')}</span></article>`}).join('')}
async function punch(kind){const b=kind==='CHECK_IN'?'inBtn':'outBtn';$(b).disabled=true;try{if(!navigator.geolocation)throw Error('This browser does not provide location.');const pos=await new Promise((resolve,reject)=>navigator.geolocation.getCurrentPosition(resolve,e=>reject(Error(e.message||'Location permission is required.')),{enableHighAccuracy:true,timeout:20000,maximumAge:0}));await rpc('appPunch',token,kind,pos.coords.latitude,pos.coords.longitude,pos.coords.accuracy);await refreshMine();toast(kind==='CHECK_IN'?'Check-in saved':'Check-out saved')}catch(e){toast(e.message);$(b).disabled=false}}
$('inBtn').onclick=()=>punch('CHECK_IN');$('outBtn').onclick=()=>punch('CHECK_OUT');
$('reportForm').onsubmit=async ev=>{ev.preventDefault();const form=ev.currentTarget;const b=ev.submitter;b.disabled=true;const d=Object.fromEntries(new FormData(form).entries());try{await rpc('appSaveProgress',token,d);form.reset();await refreshMine();msg('reportMsg','Progress saved.');toast('Progress report saved')}catch(e){msg('reportMsg',e.message)}finally{b.disabled=false}};
document.querySelectorAll('.tab[data-view]').forEach(b=>b.onclick=async()=>{document.querySelectorAll('.tab[data-view]').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.view').forEach(x=>x.classList.add('hidden'));$(b.dataset.view+'View').classList.remove('hidden');if(b.dataset.view==='schedule')await refreshMySchedule();if(b.dataset.view==='tasks')await refreshMyTasks();if(b.dataset.view==='requests')await refreshMyRequests()});
async function loadEmployees(){employees=await rpc('appManagerEmployees',token);const options='<option value="">Select employee…</option>'+employees.map(e=>`<option value="${esc(e.id)}">${esc(e.name)} · ${esc(e.id)}</option>`).join('');$('employeeSelect').innerHTML=options;$('scheduleEmployee').innerHTML=options;$('taskEmployee').innerHTML=options;const now=new Date(),from=new Date(now);from.setDate(now.getDate()-30);$('toDate').value=now.toISOString().slice(0,10);$('fromDate').value=from.toISOString().slice(0,10);$('scheduleDate').value=now.toISOString().slice(0,10);$('taskDueDate').value=now.toISOString().slice(0,10)}
async function refreshDashboard(){const d=await rpc('appManagerDashboard',token),s=d.summary;$('dashDate').textContent='As of '+d.date;$('statTeam').textContent=s.team;$('statIn').textContent=s.checkedIn;$('statReports').textContent=s.reported;$('statBlocked').textContent=s.blocked;$('teamDashboard').innerHTML=d.people.length?d.people.map(p=>`<article class="record"><div><strong>${esc(p.name)} · ${esc(p.id)}</strong><span>${esc(p.role||'Employee')} · ${esc(p.attendance)} · ${p.reported?'Report submitted':'No report yet'}</span>${p.progress?`<span class="subline">${esc(p.progress['Work Summary']||'')} · ${esc(p.progress.Status||'')}</span>`:''}</div><button class="secondary" data-employee="${esc(p.id)}">Details</button></article>`).join(''):'<div class="record">No employee records found.</div>';document.querySelectorAll('[data-employee]').forEach(b=>b.onclick=()=>{$('employeeSelect').value=b.dataset.employee;$('loadEmployee').click()});await refreshTasks()}
$('refreshDashboard').onclick=async()=>{try{await refreshDashboard();toast('Dashboard updated')}catch(e){toast(e.message)}};
function scheduleMarkup(rows){if(!rows.length)return '<article class="record"><span>No upcoming schedules.</span></article>';return rows.map(r=>`<article class="record"><div><strong>${esc(r['Shift / Assignment']||'Scheduled shift')}</strong><span>${esc(r['Work Date']||'')} · ${esc(r['Start Time']||'')}–${esc(r['End Time']||'')}</span>${r['Location']?`<span>Location: ${esc(r['Location'])}</span>`:''}${r['Instructions']?`<span>${esc(r['Instructions'])}</span>`:''}</div></article>`).join('')}
async function refreshMySchedule(){try{const rows=await rpc('appGetMySchedule',token);$('mySchedule').innerHTML=scheduleMarkup(rows)}catch(e){$('mySchedule').innerHTML=`<article class="record"><span>${esc(e.message)}</span></article>`}}
async function refreshTeamSchedules(){try{const start=new Date(),end=new Date();end.setDate(end.getDate()+60);const rows=await rpc('appManagerGetSchedules',token,start.toISOString().slice(0,10),end.toISOString().slice(0,10));$('teamSchedules').innerHTML=rows.map(r=>`<article class="record"><div><strong>${esc(r['Employee Name'])} · ${esc(r['Shift / Assignment'])}</strong><span>${esc(r['Work Date'])} · ${esc(r['Start Time'])}–${esc(r['End Time'])}</span>${r['Location']?`<span>Location: ${esc(r['Location'])}</span>`:''}${r['Instructions']?`<span>${esc(r['Instructions'])}</span>`:''}</div></article>`).join('')||'<article class="record"><span>No schedules in the next 60 days.</span></article>'}catch(e){$('teamSchedules').innerHTML=`<article class="record"><span>${esc(e.message)}</span></article>`}}
$('refreshMySchedule').onclick=refreshMySchedule;$('refreshTeamSchedules').onclick=refreshTeamSchedules;
$('managerScheduleForm').onsubmit=async ev=>{ev.preventDefault();const form=ev.currentTarget;const b=ev.submitter;b.disabled=true;const payload=Object.fromEntries(new FormData(form).entries());try{await rpc('appManagerSaveSchedule',token,payload);form.reset();$('scheduleDate').value=new Date().toISOString().slice(0,10);msg('scheduleMsg','Schedule saved.');await refreshTeamSchedules();toast('Schedule saved')}catch(e){msg('scheduleMsg',e.message)}finally{b.disabled=false}};
async function refreshMyTasks(){try{const rows=await rpc('appGetMyTasks',token);$('myTasks').innerHTML=rows.length?rows.map(t=>`<article class="record taskCard"><div><strong>${esc(t.Task)} · ${esc(t.Priority)}</strong><span>Due ${esc(t['Due Date'])} · ${esc(t.Status)}</span>${t.Details?`<span>${esc(t.Details)}</span>`:''}<label>Status<select id="taskStatus_${esc(t['Task ID'])}" data-task-status="${esc(t['Task ID'])}"><option>Assigned</option><option>In progress</option><option>Blocked</option></select></label><label>Update note<input data-task-note="${esc(t['Task ID'])}" maxlength="600" value="${esc(t['Completion Note']||'')}"></label><button class="secondary" data-save-task="${esc(t['Task ID'])}">Save update</button><button class="primary" data-complete-task="${esc(t['Task ID'])}">Mark complete · record location</button></div></article>`).join(''):'<article class="record"><span>No tasks assigned yet.</span></article>';rows.forEach(t=>{document.getElementById('taskStatus_'+t['Task ID']).value=t.Status});document.querySelectorAll('[data-save-task]').forEach(b=>b.onclick=async()=>{b.disabled=true;const id=b.dataset.saveTask;try{await rpc('appUpdateMyTask',token,id,$(`[data-task-status="${CSS.escape(id)}"]`).value,$(`[data-task-note="${CSS.escape(id)}"]`).value);await refreshMyTasks();toast('Task updated')}catch(e){toast(e.message)}finally{b.disabled=false}});document.querySelectorAll('[data-complete-task]').forEach(b=>b.onclick=async()=>{b.disabled=true;const id=b.dataset.completeTask;try{if(!navigator.geolocation)throw Error('This browser does not provide location.');const pos=await new Promise((resolve,reject)=>navigator.geolocation.getCurrentPosition(resolve,e=>reject(Error(e.message||'Allow location to record task completion.')),{enableHighAccuracy:true,timeout:20000,maximumAge:0}));await rpc('appCompleteMyTask',token,id,$(`[data-task-note="${CSS.escape(id)}"]`).value,pos.coords.latitude,pos.coords.longitude,pos.coords.accuracy);await refreshMyTasks();if(ctx&&ctx.manager){await refreshTasks();await refreshDashboard()}toast('Task completed with location')}catch(e){toast(e.message)}finally{b.disabled=false}})}catch(e){$('myTasks').innerHTML=`<article class="record"><span>${esc(e.message)}</span></article>`}}
$('refreshMyTasks').onclick=refreshMyTasks;
async function refreshTasks(){try{const rows=await rpc('appManagerGetTasks',token),today=new Date().toISOString().slice(0,10),open=rows.filter(t=>t.Status!=='Completed'),overdue=open.filter(t=>t['Due Date']<today);$('statTasksOpen').textContent=open.length;$('statTasksOverdue').textContent=overdue.length;$('managerTasks').innerHTML=rows.length?rows.map(t=>`<article class="record"><div><strong>${esc(t['Employee Name'])}: ${esc(t.Task)}</strong><span>${esc(t.Priority)} · due ${esc(t['Due Date'])} · ${esc(t.Status)}</span>${t.Details?`<span>${esc(t.Details)}</span>`:''}${t['Completion Note']?`<span>Update: ${esc(t['Completion Note'])}</span>`:''}${t['Completion Latitude']!==''&&t['Completion Latitude']!=null?`<span>Completed ${esc(t['Completion Location At']||t['Completed At'])} · accuracy ${esc(t['Completion Accuracy M'])} m</span><a target="_blank" rel="noopener" href="https://www.google.com/maps?q=${encodeURIComponent(t['Completion Latitude']+','+t['Completion Longitude'])}">View completion location</a>`:''}</div></article>`).join(''):'<article class="record"><span>No tasks assigned.</span></article>'}catch(e){$('managerTasks').innerHTML=`<article class="record"><span>${esc(e.message)}</span></article>`}}
$('refreshTasks').onclick=refreshTasks;
$('taskForm').onsubmit=async ev=>{ev.preventDefault();const form=ev.currentTarget;const b=ev.submitter;b.disabled=true;try{await rpc('appManagerAssignTask',token,Object.fromEntries(new FormData(form).entries()));form.reset();$('taskDueDate').value=new Date().toISOString().slice(0,10);msg('taskMsg','Task assigned.');await refreshTasks();toast('Task assigned')}catch(e){msg('taskMsg',e.message)}finally{b.disabled=false}};
async function refreshMyRequests(){try{const rows=await rpc('appGetMyRequests',token);$('myRequests').innerHTML=rows.length?rows.map(r=>`<article class="record"><div><strong>${esc(r.Type)} · ${esc(r.Status)}</strong><span>${esc(r['Start Date'])}${r['End Date']!==r['Start Date']?' to '+esc(r['End Date']):''}${r.Type==='Shift change'?' · requested '+esc(r['Proposed Start'])+'–'+esc(r['Proposed End']):''}</span><span>${esc(r.Reason)}</span>${r['Review Note']?`<span>Manager note: ${esc(r['Review Note'])}</span>`:''}</div></article>`).join(''):'<article class="record"><span>No requests submitted.</span></article>'}catch(e){$('myRequests').innerHTML=`<article class="record"><span>${esc(e.message)}</span></article>`}}
$('refreshMyRequests').onclick=refreshMyRequests;$('requestType').onchange=()=>{const shift=$('requestType').value==='Shift change';$('proposedTimes').classList.toggle('hidden',!shift);$('requestForm').elements.endDate.disabled=shift;if(shift)$('requestForm').elements.endDate.value=$('requestForm').elements.startDate.value};$('requestForm').elements.startDate.onchange=()=>{if($('requestType').value==='Shift change')$('requestForm').elements.endDate.value=$('requestForm').elements.startDate.value};
$('requestForm').onsubmit=async ev=>{ev.preventDefault();const form=ev.currentTarget;const b=ev.submitter;b.disabled=true;try{await rpc('appSubmitRequest',token,Object.fromEntries(new FormData(form).entries()));form.reset();$('proposedTimes').classList.add('hidden');$('requestForm').elements.endDate.disabled=false;msg('requestMsg','Request sent to your manager.');await refreshMyRequests();toast('Request submitted')}catch(e){msg('requestMsg',e.message)}finally{b.disabled=false}};
async function refreshRequests(){try{const rows=await rpc('appManagerGetRequests',token);$('managerRequests').innerHTML=rows.length?rows.map(r=>`<article class="record"><div><strong>${esc(r['Employee Name'])} · ${esc(r.Type)}</strong><span>${esc(r['Start Date'])}${r['End Date']!==r['Start Date']?' to '+esc(r['End Date']):''}${r.Type==='Shift change'?' · proposed '+esc(r['Proposed Start'])+'–'+esc(r['Proposed End']):''}</span><span>${esc(r.Reason)}</span></div><div><button class="secondary" data-review="${esc(r['Request ID'])}" data-decision="Approved">Approve</button> <button class="secondary" data-review="${esc(r['Request ID'])}" data-decision="Declined">Decline</button></div></article>`).join(''):'<article class="record"><span>No pending requests.</span></article>';document.querySelectorAll('[data-review]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{await rpc('appManagerReviewRequest',token,b.dataset.review,b.dataset.decision,'');await refreshRequests();toast('Request '+b.dataset.decision.toLowerCase())}catch(e){toast(e.message)}finally{b.disabled=false}})}catch(e){$('managerRequests').innerHTML=`<article class="record"><span>${esc(e.message)}</span></article>`}}
$('refreshRequests').onclick=refreshRequests;
async function refreshWeeklyReport(){try{const r=await rpc('appManagerWeeklyReport',token,'',''),s=r.summary;$('weeklySummary').innerHTML=`<h3>${esc(r.from)} to ${esc(r.to)}</h3><p>${s.team} team members · ${s.checkIns} check-ins · ${s.reports} reports · ${s.tasksDone} tasks completed · ${s.tasksOverdue} overdue · ${s.blocked} blocked reports</p>`;$('weeklyPeople').innerHTML=r.people.map(p=>`<article class="record"><div><strong>${esc(p.name)} · ${esc(p.id)}</strong><span>Check-ins ${p.attendance} · reports ${p.reports} · tasks ${p.tasksDone}/${p.tasksDone+p.tasksOpen} complete · overdue ${p.tasksOverdue} · blocked ${p.blocked}</span></div></article>`).join('')||'<article class="record"><span>No team data for this period.</span></article>'}catch(e){$('weeklySummary').textContent=e.message}}
$('loadWeeklyReport').onclick=refreshWeeklyReport;
$('enableDigests').onclick=async()=>{const b=$('enableDigests');b.disabled=true;try{const r=await rpc('appManagerEnableEmailDigests',token);msg('digestMsg',r.message)}catch(e){msg('digestMsg',e.message)}finally{b.disabled=false}};
$('loadEmployee').onclick=async()=>{const id=$('employeeSelect').value;if(!id){msg('managerMsg','Select an employee first.');return}const b=$('loadEmployee');b.disabled=true;try{const r=await rpc('appManagerEmployeeDetail',token,id,$('fromDate').value,$('toDate').value);$('employeeDetail').classList.remove('hidden');$('employeeSummary').innerHTML=`<h3>${esc(r.profile.name)}</h3><p>${esc(r.profile.id)} · ${esc(r.profile.role)} · ${r.attendance.length} attendance records · ${r.progress.length} reports</p>`;$('teamAttendance').innerHTML=recordMarkup(r.attendance,'attendance');$('teamProgress').innerHTML=recordMarkup(r.progress,'progress');msg('managerMsg','Showing selected date range.')}catch(e){msg('managerMsg',e.message)}finally{b.disabled=false}};
$('logout').onclick=()=>signOutSession('You are signed out.');
function readSession(){try{return JSON.parse(localStorage.getItem(SESSION_KEY)||'null')}catch(_){return null}}
function saveSession(lastActivity){if(!token||!profile)return;localStorage.setItem(SESSION_KEY,JSON.stringify({token:token,profile:profile,lastActivity:lastActivity||Date.now()}))}
function markSessionActivity(){if(!token)return;const saved=readSession(),now=Date.now();if(saved&&now-Number(saved.lastActivity||0)>=15000){saved.lastActivity=now;localStorage.setItem(SESSION_KEY,JSON.stringify(saved))}}
function startSessionTracking(){if(!activityBound){['pointerdown','keydown','touchstart','scroll'].forEach(name=>window.addEventListener(name,markSessionActivity,{passive:true}));window.addEventListener('storage',e=>{if(e.key===SESSION_KEY&&token){const other=readSession();if(!other||Date.now()-other.lastActivity>=IDLE_LIMIT)signOutSession('Signed out after 8 hours of inactivity.',false)}});document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkSession()});activityBound=true}if(idleTimer)clearInterval(idleTimer);lastServerPing=Date.now();idleTimer=setInterval(checkSession,60000)}
async function checkSession(){if(!token)return;const saved=readSession();if(!saved||Date.now()-Number(saved.lastActivity||0)>=IDLE_LIMIT){await signOutSession('Signed out after 8 hours of inactivity.');return}if(Date.now()-lastServerPing>=4*60*1000){lastServerPing=Date.now();try{ctx=await rpc('appGetContext',token)}catch(_){await signOutSession('Your sign-in expired. Please sign in again.',false)}}}
async function signOutSession(message,callServer=true){const old=token;token='';profile=null;ctx=null;localStorage.removeItem(SESSION_KEY);if(idleTimer){clearInterval(idleTimer);idleTimer=null}if(callServer&&old){try{await rpc('appLogout',old)}catch(_){}}$('workspace').classList.add('hidden');$('login').classList.remove('hidden');$('otpWrap').classList.add('hidden');$('loginBtn').innerHTML='Send sign-in code <span>↗</span>';$('otp').value='';$('headRight').textContent='';if(message)msg('loginMsg',message)}
async function restoreSession(){const saved=readSession();if(!saved||!saved.token||!saved.profile)return;if(!saved.lastActivity||Date.now()-Number(saved.lastActivity)>=IDLE_LIMIT){localStorage.removeItem(SESSION_KEY);msg('loginMsg','Your session ended after 8 hours of inactivity. Sign in again.');return}token=saved.token;profile=saved.profile;startSessionTracking();try{await enterApp()}catch(_){await signOutSession('Your sign-in expired. Please sign in again.',false)}}
restoreSession();

$('loginBtn').type='button';$('loginBtn').onclick=async()=>{const b=$('loginBtn'),email=$('email').value.trim(),verifying=otpRequested,code=$('otp').value.trim();if(!email){msg('loginMsg','Enter your registered work email.');$('email').focus();return}if(verifying&&!/^\d{6}$/.test(code)){msg('loginMsg','Enter the six-digit code from your email.');$('otp').focus();return}b.disabled=true;b.classList.add('is-busy');b.innerHTML=verifying?'Checking code…':'Sending code…';msg('loginMsg',verifying?'Checking your code…':'Connecting to sign-in service…');$('otpWrap').classList.remove('hidden');try{if(verifying){const r=await rpc('appVerifyOtp',email,code);token=r.token;profile=r.profile;otpRequested=false;saveSession();startSessionTracking();await enterApp()}else{const r=await rpc('appRequestOtp',email);msg('loginMsg',r.message||'Request finished. Check your email.');if(r.ok){otpRequested=true;b.innerHTML='Verify and sign in <span>↗</span>';$('otp').focus()}else{b.innerHTML='Send sign-in code <span>↗</span>'}}}catch(e){msg('loginMsg',(e&&e.message)||'Sign-in request failed. Check the message and try again.');b.innerHTML=verifying?'Retry verification <span>↗</span>':'Retry sign-in code <span>↗</span>'}finally{b.disabled=false;b.classList.remove('is-busy')}};
function showAttendanceView(name){document.querySelectorAll('.tab[data-view]').forEach(x=>x.classList.toggle('active',x.dataset.view===name));document.querySelectorAll('.view').forEach(x=>x.classList.add('hidden'));$(name+'View').classList.remove('hidden')}
punch=async function(kind){const id=kind==='CHECK_IN'?'inBtn':'outBtn',button=$(id);button.disabled=true;button.classList.add('is-busy');try{if(!navigator.geolocation)throw Error('Location is not available in this browser.');const pos=await new Promise((resolve,reject)=>navigator.geolocation.getCurrentPosition(resolve,e=>reject(Error(e.message||'Allow location to record attendance.')),{enableHighAccuracy:true,timeout:20000,maximumAge:0}));await rpc('appPunch',token,kind,pos.coords.latitude,pos.coords.longitude,pos.coords.accuracy);await refreshMine();if(kind==='CHECK_IN'){await refreshMySchedule();showAttendanceView('schedule');toast('Check-in saved · your schedule is ready')}else{showAttendanceView('report');$('reportForm').scrollIntoView({behavior:'smooth',block:'start'});toast('Check-out saved · complete your daily report')} }catch(e){toast(e.message);button.disabled=false}finally{button.classList.remove('is-busy')}}
document.addEventListener('click',event=>{const button=event.target.closest('button');if(!button||button.disabled)return;button.classList.remove('tap-pulse');void button.offsetWidth;button.classList.add('tap-pulse');setTimeout(()=>button.classList.remove('tap-pulse'),420)});
</script>
