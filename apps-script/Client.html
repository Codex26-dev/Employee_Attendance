<script>
const $=id=>document.getElementById(id);let token='',profile=null,ctx=null,myData=null,employees=[];const SESSION_KEY='rushabhWorkdaySessionV2',VIEW_KEY='rushabhWorkdayLastView';let idleTimer=null,lastServerPing=0,activityBound=false,refreshTimer=null,refreshBusy=false;
function rpc(fn,...args){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error((e&&e.message)||'Request failed')))[fn](...args))}
function msg(id,text){$(id).textContent=text||''}function toast(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2500)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
let otpRequested=false,pendingCheckout=false,pendingCheckoutLocation=null;
const loginButton=$('loginBtn');
loginButton.type='button';
loginButton.addEventListener('click',async()=>{
  const email=$('email').value.trim(), code=$('otp').value.trim(), verifying=otpRequested;
  if(!email){msg('loginMsg','Enter your registered work email.');$('email').focus();return}
  if(verifying&&!/^\d{6}$/.test(code)){msg('loginMsg','Enter the six-digit code from your email.');$('otp').focus();return}
  loginButton.disabled=true;
  loginButton.innerHTML=verifying?'Verifying code…':'Sending code…';
  msg('loginMsg',verifying?'Checking your code…':'Connecting to sign-in service…');
  if(!verifying)$('otpWrap').classList.remove('hidden');
  try{
    if(verifying){
      const r=await rpc('appVerifyOtp',email,code);
      token=r.token;profile=r.profile;otpRequested=false;if(!saveSession()){await signOutSession('This browser is blocking saved sign-in. Allow site storage, then sign in again.',true);return}startSessionTracking();await enterApp();
    }else{
      const r=await rpc('appRequestOtp',email);
      msg('loginMsg',r.message||'Request finished. Check the message above.');
      if(r.ok){otpRequested=true;loginButton.innerHTML='Verify and sign in <span>↗</span>';$('otp').focus()}
      else{loginButton.innerHTML='Send sign-in code <span>↗</span>'}
    }
  }catch(e){
    msg('loginMsg',(e&&e.message)||'Could not reach sign-in service. Check your connection and try again.');
    loginButton.innerHTML=verifying?'Retry verification <span>↗</span>':'Retry sign-in code <span>↗</span>';
  }finally{loginButton.disabled=false}
});
async function enterApp(){$('login').classList.add('hidden');$('workspace').classList.remove('hidden');$('headRight').innerHTML='<span class="pill">'+esc(profile.role)+'</span>';$('nameLabel').textContent=profile.name.split(' ')[0]+'.';$('roleLabel').textContent=profile.role.toUpperCase()+' · TODAY';$('dateLabel').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});try{ctx=await rpc('appGetContext',token)}catch(e){msg('sessionStatus','You are still signed in. Data refresh failed: '+(e.message||'connection issue')+'. Reconnecting automatically…');return}if(ctx.manager){$('managerTab').classList.remove('hidden');const tasks=[loadEmployees,refreshDashboard,refreshTeamSchedules,refreshRequests,refreshWeeklyReport,refreshManagerAmcReports].map(fn=>Promise.resolve().then(fn));await Promise.allSettled(tasks)}if(ctx.commerce){$('commerceTab').classList.remove('hidden');await initCommerce()}const results=await Promise.allSettled([refreshMine,refreshAmcOptions,refreshMyAmc,refreshMySchedule,refreshMyTasks,refreshMyRequests].map(fn=>Promise.resolve().then(fn)));const dataResult=results[0];let preferred='';try{preferred=localStorage.getItem(VIEW_KEY)||''}catch(_){}const allowedViews=['home','schedule','tasks','requests','report','amc','manager','commerce'];if(preferred==='manager'&&!ctx.manager)preferred='';if(preferred==='commerce'&&!ctx.commerce)preferred='';if(allowedViews.includes(preferred))showView(preferred);else if(dataResult.status==='fulfilled'&&myData){const todayRows=myData.attendance.filter(r=>String(r['Work Date']).slice(0,10)===myData.today);if(todayRows.some(r=>r.Event==='CHECK_OUT'))showView('report');else if(todayRows.some(r=>r.Event==='CHECK_IN'))showView('schedule')}if(results.some(r=>r.status==='rejected'))msg('sessionStatus','Signed in · some data could not refresh yet. It will retry automatically.')}
async function refreshMine(){myData=await rpc('appGetMyData',token);const today=myData.today,att=myData.attendance.filter(r=>String(r['Work Date']).slice(0,10)===today);const i=att.find(r=>r.Event==='CHECK_IN'),o=att.find(r=>r.Event==='CHECK_OUT');$('attendanceState').textContent=o?'Day complete':i?'Checked in':'Not checked in';$('inTime').textContent=i?'Recorded '+i['Server Timestamp']:'';$('outTime').textContent=o?'Recorded '+o['Server Timestamp']:'';$('inBtn').disabled=!!i;$('outBtn').disabled=!i||!!o;$('myRecords').innerHTML=recordMarkup(myData.attendance.slice(0,12),'attendance');$('myProgress').innerHTML=recordMarkup(myData.progress.slice(0,12),'progress')}
function recordMarkup(rows,type){if(!rows.length)return '<div class="record"><span>No records yet.</span></div>';return rows.map(r=>{const title=type==='attendance'?String(r.Event||'').replace('_',' '):(r['Project / Client']||'Daily progress');const location=r['Geofence Result']||((r['Office Distance M']!==''&&r['Office Distance M']!=null)?r['Office Distance M']+' m from office':'GPS not provided');const text=type==='attendance'?`${r['Server Timestamp']} · ${location}`:`${r['Work Summary']} · ${r.Status} · ${r.Hours}h`;const more=type==='progress'?[['Blockers',r.Blockers],['Support needed',r['Support Needed']],['Next day plan',r['Next Day Plan']],['Work location',r['Work Location']],['Priority',r.Priority],['Additional work',r['Additional Work']],['New skills',r['New Skills']]].filter(x=>x[1]).map(x=>`<span>${esc(x[0])}: ${esc(x[1])}</span>`).join(''):'';return `<article class="record"><div><strong>${esc(title)}</strong><span>${esc(text)}</span>${more}</div><span class="tag">${esc(r['Work Date']||'')}</span></article>`}).join('')}
function showView(name){document.querySelectorAll('.tab[data-view]').forEach(x=>{const active=x.dataset.view===name;x.classList.toggle('active',active);if(active)x.setAttribute('aria-current','page');else x.removeAttribute('aria-current')});document.querySelectorAll('.view').forEach(x=>x.classList.add('hidden'));$(name+'View').classList.remove('hidden');try{localStorage.setItem(VIEW_KEY,name)}catch(_){}window.scrollTo({top:0,behavior:'smooth'})}
async function optionalLocation(){if(!navigator.geolocation)return null;try{const pos=await new Promise((resolve,reject)=>navigator.geolocation.getCurrentPosition(resolve,reject,{enableHighAccuracy:false,timeout:4500,maximumAge:60000}));return {lat:pos.coords.latitude,lon:pos.coords.longitude,accuracy:pos.coords.accuracy}}catch(_){return null}}
async function punch(kind){const b=kind==='CHECK_IN'?'inBtn':'outBtn';$(b).disabled=true;try{const pos=await optionalLocation();if(kind==='CHECK_IN'){await rpc('appPunch',token,kind,pos?pos.lat:'',pos?pos.lon:'',pos?pos.accuracy:'');pendingCheckout=false;pendingCheckoutLocation=null;await refreshMine();await refreshAmcOptions();await refreshMyAmc();await refreshMySchedule();showView('schedule');toast(pos?'Checked in · schedule is ready':'Checked in without GPS · schedule is ready')}else{pendingCheckoutLocation=pos;pendingCheckout=true;showView('report');const submit=$('reportForm').querySelector('button[type="submit"],button:not([type])');if(submit)submit.innerHTML='Save report & check out <span>↗</span>';$('reportForm').scrollIntoView({behavior:'smooth',block:'start'});toast(pos?'Complete your report to check out':'GPS skipped · complete your report to check out')}}catch(e){toast(e.message)}finally{$(b).disabled=false}}
$('inBtn').onclick=()=>punch('CHECK_IN');$('outBtn').onclick=()=>punch('CHECK_OUT');
$('reportForm').onsubmit=async ev=>{ev.preventDefault();const form=ev.currentTarget;const b=ev.submitter;b.disabled=true;const d=Object.fromEntries(new FormData(form).entries());try{if(pendingCheckout){const p=pendingCheckoutLocation;await rpc('appSaveDailyReportAndCheckout',token,d,p?p.lat:'',p?p.lon:'',p?p.accuracy:'');pendingCheckout=false;pendingCheckoutLocation=null;form.reset();b.innerHTML='Save progress <span>↗</span>';await refreshMine();msg('reportMsg','Report saved and check-out recorded.');toast('Report saved · you are checked out')}else{await rpc('appSaveProgress',token,d);form.reset();await refreshMine();msg('reportMsg','Progress saved.');toast('Progress report saved')}}catch(e){msg('reportMsg',e.message)}finally{b.disabled=false}};
document.querySelectorAll('.tab[data-view]').forEach(b=>b.onclick=async()=>{showView(b.dataset.view);if(b.dataset.view==='schedule')await refreshMySchedule();if(b.dataset.view==='tasks')await refreshMyTasks();if(b.dataset.view==='requests')await refreshMyRequests()});
async function loadEmployees(){employees=await rpc('appManagerEmployees',token);const options='<option value="">Select employee…</option>'+employees.map(e=>`<option value="${esc(e.id)}">${esc(e.name)} · ${esc(e.id)}</option>`).join('');$('employeeSelect').innerHTML=options;$('scheduleEmployee').innerHTML=options;$('taskEmployee').innerHTML=options;const now=new Date(),from=new Date(now);from.setDate(now.getDate()-30);$('toDate').value=now.toISOString().slice(0,10);$('fromDate').value=from.toISOString().slice(0,10);$('scheduleDate').value=now.toISOString().slice(0,10);$('taskDueDate').value=now.toISOString().slice(0,10)}
async function refreshDashboard(){const d=await rpc('appManagerDashboard',token),s=d.summary;$('dashDate').textContent='As of '+d.date;$('statTeam').textContent=s.team;$('statIn').textContent=s.checkedIn;$('statReports').textContent=s.reported;$('statBlocked').textContent=s.blocked;$('teamDashboard').innerHTML=d.people.length?d.people.map(p=>`<article class="record"><div><strong>${esc(p.name)} · ${esc(p.id)}</strong><span>${esc(p.role||'Employee')} · ${esc(p.attendance)} · ${p.reported?'Report submitted':'No report yet'}</span>${p.metrics?`<span class="attendanceBadge ${p.metrics.status==='Absent'?'absent':p.metrics.status==='Half day'?'half':p.metrics.highlight?'pending':''}">Day: ${esc(p.metrics.status)} · ${p.metrics.hours==null?'—':Number(p.metrics.hours).toFixed(2)} h${p.metrics.late?' · Late':''}</span>`:''}${p.progress?`<span class="subline">${esc(p.progress['Work Summary']||'')} · ${esc(p.progress.Status||'')}</span>`:''}</div><button class="secondary" data-employee="${esc(p.id)}">Details</button></article>`).join(''):'<div class="record">No employee records found.</div>';document.querySelectorAll('[data-employee]').forEach(b=>b.onclick=()=>{$('employeeSelect').value=b.dataset.employee;$('loadEmployee').click()});await refreshTasks()}
$('refreshDashboard').onclick=async()=>{try{await refreshDashboard();toast('Dashboard updated')}catch(e){toast(e.message)}};
function scheduleMarkup(rows){const today=rows.filter(r=>String(r['Work Date']).slice(0,10)===myData.today),later=rows.filter(r=>String(r['Work Date']).slice(0,10)>myData.today);const card=r=>`<article class="record"><div><strong>${esc(r['Shift / Assignment']||'Scheduled shift')}</strong><span>${esc(r['Work Date']||'')} · ${esc(r['Start Time']||'')}–${esc(r['End Time']||'')}</span>${r['Location']?`<span>Location: ${esc(r['Location'])}</span>`:''}${r['Instructions']?`<span>${esc(r['Instructions'])}</span>`:''}</div></article>`;$('scheduleCheckinNotice').textContent='Checked in for '+myData.today+'. Your schedule is shown below.';return (today.length?'<h3 class="scheduleGroupTitle">Today&#39;s assignment</h3>'+today.map(card).join(''):'<article class="record scheduleEmpty"><strong>No assignment scheduled for today</strong><span>Your check-in is saved. Ask your manager to add your assignment in Team view → Assign a schedule.</span></article>')+(later.length?'<h3 class="scheduleGroupTitle">Upcoming shifts</h3>'+later.slice(0,10).map(card).join(''):'')}
async function refreshMySchedule(){try{const rows=await rpc('appGetMySchedule',token);$('mySchedule').innerHTML=scheduleMarkup(rows)}catch(e){$('scheduleCheckinNotice').textContent='Your check-in is saved, but the schedule could not load.';$('mySchedule').innerHTML=`<article class="record"><span>${esc(e.message)}</span></article>`}}
async function refreshTeamSchedules(){try{const start=new Date(),end=new Date();end.setDate(end.getDate()+60);const rows=await rpc('appManagerGetSchedules',token,start.toISOString().slice(0,10),end.toISOString().slice(0,10));$('teamSchedules').innerHTML=rows.map(r=>`<article class="record"><div><strong>${esc(r['Employee Name'])} · ${esc(r['Shift / Assignment'])}</strong><span>${esc(r['Work Date'])} · ${esc(r['Start Time'])}–${esc(r['End Time'])}</span>${r['Location']?`<span>Location: ${esc(r['Location'])}</span>`:''}${r['Instructions']?`<span>${esc(r['Instructions'])}</span>`:''}</div></article>`).join('')||'<article class="record"><span>No schedules in the next 60 days.</span></article>'}catch(e){$('teamSchedules').innerHTML=`<article class="record"><span>${esc(e.message)}</span></article>`}}
$('refreshMySchedule').onclick=refreshMySchedule;$('refreshTeamSchedules').onclick=refreshTeamSchedules;
$('managerScheduleForm').onsubmit=async ev=>{ev.preventDefault();const form=ev.currentTarget;const b=ev.submitter;b.disabled=true;const payload=Object.fromEntries(new FormData(form).entries());try{await rpc('appManagerSaveSchedule',token,payload);form.reset();$('scheduleDate').value=new Date().toISOString().slice(0,10);msg('scheduleMsg','Schedule saved.');await refreshTeamSchedules();toast('Schedule saved')}catch(e){msg('scheduleMsg',e.message)}finally{b.disabled=false}};
async function refreshMyTasks(){try{const rows=await rpc('appGetMyTasks',token);$('myTasks').innerHTML=rows.length?rows.map(t=>`<article class="record taskCard"><div><strong>${esc(t.Task)} · ${esc(t.Priority)}</strong><span>Due ${esc(t['Due Date'])} · ${esc(t.Status)}</span>${t.Details?`<span>${esc(t.Details)}</span>`:''}<label>Status<select id="taskStatus_${esc(t['Task ID'])}" data-task-status="${esc(t['Task ID'])}"><option>Assigned</option><option>In progress</option><option>Blocked</option></select></label><label>Update note<input data-task-note="${esc(t['Task ID'])}" maxlength="600" value="${esc(t['Completion Note']||'')}"></label><button class="secondary" data-save-task="${esc(t['Task ID'])}">Save update</button><button class="primary" data-complete-task="${esc(t['Task ID'])}">Mark complete · record location</button></div></article>`).join(''):'<article class="record"><span>No tasks assigned yet.</span></article>';rows.forEach(t=>{document.getElementById('taskStatus_'+t['Task ID']).value=t.Status});document.querySelectorAll('[data-save-task]').forEach(b=>b.onclick=async()=>{b.disabled=true;const id=b.dataset.saveTask;try{await rpc('appUpdateMyTask',token,id,$(`[data-task-status="${CSS.escape(id)}"]`).value,$(`[data-task-note="${CSS.escape(id)}"]`).value);await refreshMyTasks();toast('Task updated')}catch(e){toast(e.message)}finally{b.disabled=false}});document.querySelectorAll('[data-complete-task]').forEach(b=>b.onclick=async()=>{b.disabled=true;const id=b.dataset.completeTask;try{if(!navigator.geolocation)throw Error('This browser does not provide location.');const pos=await new Promise((resolve,reject)=>navigator.geolocation.getCurrentPosition(resolve,e=>reject(Error(e.message||'Allow location to record task completion.')),{enableHighAccuracy:true,timeout:20000,maximumAge:0}));await rpc('appCompleteMyTask',token,id,$(`[data-task-note="${CSS.escape(id)}"]`).value,pos.coords.latitude,pos.coords.longitude,pos.coords.accuracy);await refreshMyTasks();if(ctx&&ctx.manager){await refreshTasks();await refreshDashboard()}toast('Task completed with location')}catch(e){toast(e.message)}finally{b.disabled=false}})}catch(e){$('myTasks').innerHTML=`<article class="record"><span>${esc(e.message)}</span></article>`}}
$('refreshMyTasks').onclick=refreshMyTasks;
async function refreshTasks(){try{const rows=await rpc('appManagerGetTasks',token),today=new Date().toISOString().slice(0,10),open=rows.filter(t=>t.Status!=='Completed'),overdue=open.filter(t=>t['Due Date']<today);$('statTasksOpen').textContent=open.length;$('statTasksOverdue').textContent=overdue.length;$('managerTasks').innerHTML=rows.length?rows.map(t=>`<article class="record"><div><strong>${esc(t['Employee Name'])}: ${esc(t.Task)}</strong><span>${esc(t.Priority)} · due ${esc(t['Due Date'])} · ${esc(t.Status)}</span>${t.Details?`<span>${esc(t.Details)}</span>`:''}${t['Completion Note']?`<span>Update: ${esc(t['Completion Note'])}</span>`:''}${t['Completion Latitude']!==''&&t['Completion Latitude']!=null?`<span>Completed ${esc(t['Completion Location At']||t['Completed At'])} · accuracy ${esc(t['Completion Accuracy M'])} m</span><a target="_blank" rel="noopener" href="https://www.google.com/maps?q=${encodeURIComponent(t['Completion Latitude']+','+t['Completion Longitude'])}">View completion location</a>`:''}</div></article>`).join(''):'<article class="record"><span>No tasks assigned.</span></article>'}catch(e){$('managerTasks').innerHTML=`<article class="record"><span>${esc(e.message)}</span></article>`}}
$('refreshTasks').onclick=refreshTasks;
$('taskForm').onsubmit=async ev=>{ev.preventDefault();const form=ev.currentTarget;const b=ev.submitter;b.disabled=true;try{await rpc('appManagerAssignTask',token,Object.fromEntries(new FormData(form).entries()));form.reset();$('taskDueDate').value=new Date().toISOString().slice(0,10);msg('taskMsg','Task assigned.');await refreshTasks();toast('Task assigned')}catch(e){msg('taskMsg',e.message)}finally{b.disabled=false}};
async function refreshMyRequests(){try{const rows=await rpc('appGetMyRequests',token);$('myRequests').innerHTML=rows.length?rows.map(r=>`<article class="record"><div><strong>${esc(r.Type)} · ${esc(r.Status)}</strong><span>${esc(r['Start Date'])}${r['End Date']!==r['Start Date']?' to '+esc(r['End Date']):''}${r.Type==='Shift change'?' · requested '+esc(r['Proposed Start'])+'–'+esc(r['Proposed End']):''}</span><span>${esc(r.Reason)}</span>${r['Review Note']?`<span>Manager note: ${esc(r['Review Note'])}</span>`:''}</div></article>`).join(''):'<article class="record"><span>No requests submitted.</span></article>'}catch(e){$('myRequests').innerHTML=`<article class="record"><span>${esc(e.message)}</span></article>`}}
$('refreshMyRequests').onclick=refreshMyRequests;$('requestType').onchange=()=>{const shift=$('requestType').value==='Shift change';$('proposedTimes').classList.toggle('hidden',!shift);$('requestForm').elements.endDate.disabled=shift;if(shift)$('requestForm').elements.endDate.value=$('requestForm').elements.startDate.value};$('requestForm').elements.startDate.onchange=()=>{if($('requestType').value==='Shift change')$('requestForm').elements.endDate.value=$('requestForm').elements.startDate.value};
$('requestForm').onsubmit=async ev=>{ev.preventDefault();const form=ev.currentTarget;const b=ev.submitter;b.disabled=true;try{await rpc('appSubmitRequest',token,Object.fromEntries(new FormData(form).entries()));form.reset();$('proposedTimes').classList.add('hidden');$('requestForm').elements.endDate.disabled=false;msg('requestMsg','Request sent to your manager.');await refreshMyRequests();toast('Request submitted')}catch(e){msg('requestMsg',e.message)}finally{b.disabled=false}};
async function refreshRequests(){try{const rows=await rpc('appManagerGetRequests',token);$('managerRequests').innerHTML=rows.length?rows.map(r=>`<article class="record"><div><strong>${esc(r['Employee Name'])} · ${esc(r.Type)}</strong><span>${esc(r['Start Date'])}${r['End Date']!==r['Start Date']?' to '+esc(r['End Date']):''}${r.Type==='Shift change'?' · proposed '+esc(r['Proposed Start'])+'–'+esc(r['Proposed End']):''}</span><span>${esc(r.Reason)}</span></div><div><button class="secondary" data-review="${esc(r['Request ID'])}" data-decision="Approved">Approve</button> <button class="secondary" data-review="${esc(r['Request ID'])}" data-decision="Declined">Decline</button></div></article>`).join(''):'<article class="record"><span>No pending requests.</span></article>';document.querySelectorAll('[data-review]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{await rpc('appManagerReviewRequest',token,b.dataset.review,b.dataset.decision,'');await refreshRequests();toast('Request '+b.dataset.decision.toLowerCase())}catch(e){toast(e.message)}finally{b.disabled=false}})}catch(e){$('managerRequests').innerHTML=`<article class="record"><span>${esc(e.message)}</span></article>`}}
$('refreshRequests').onclick=refreshRequests;
async function refreshWeeklyReport(){try{const r=await rpc('appManagerWeeklyReport',token,'',''),s=r.summary;$('weeklySummary').innerHTML=`<h3>${esc(r.from)} to ${esc(r.to)}</h3><p>${s.team} team members · ${s.checkIns} check-ins · ${s.reports} reports · ${s.tasksDone} tasks completed · ${s.tasksOverdue} overdue · ${s.blocked} blocked reports</p>`;$('weeklyPeople').innerHTML=r.people.map(p=>`<article class="record"><div><strong>${esc(p.name)} · ${esc(p.id)}</strong><span>Check-ins ${p.attendance} · reports ${p.reports} · tasks ${p.tasksDone}/${p.tasksDone+p.tasksOpen} complete · overdue ${p.tasksOverdue} · blocked ${p.blocked}</span></div></article>`).join('')||'<article class="record"><span>No team data for this period.</span></article>'}catch(e){$('weeklySummary').textContent=e.message}}
$('loadWeeklyReport').onclick=refreshWeeklyReport;
$('enableDigests').onclick=async()=>{const b=$('enableDigests');b.disabled=true;try{const r=await rpc('appManagerEnableEmailDigests',token);msg('digestMsg',r.message)}catch(e){msg('digestMsg',e.message)}finally{b.disabled=false}};
async function refreshEmployeeDetail(){const id=$('employeeSelect').value;if(!id||$('employeeDetail').classList.contains('hidden'))return;const r=await rpc('appManagerEmployeeDetail',token,id,$('fromDate').value,$('toDate').value);$('employeeDetail').classList.remove('hidden');$('employeeSummary').innerHTML=`<h3>${esc(r.profile.name)}</h3><p>${esc(r.profile.id)} · ${esc(r.profile.role)} · ${r.attendance.length} attendance records · ${r.progress.length} reports</p>`;$('teamAttendance').innerHTML=recordMarkup(r.attendance,'attendance');$('teamProgress').innerHTML=recordMarkup(r.progress,'progress')}
$('loadEmployee').onclick=async()=>{if(!$('employeeSelect').value){msg('managerMsg','Select an employee first.');return}const b=$('loadEmployee');b.disabled=true;try{await refreshEmployeeDetail();msg('managerMsg','Showing selected date range.')}catch(e){msg('managerMsg',e.message)}finally{b.disabled=false}};
$('logout').onclick=()=>signOutSession('You are signed out.');
function readSession(){try{return JSON.parse(localStorage.getItem(SESSION_KEY)||localStorage.getItem('rushabhWorkdaySessionV1')||'null')}catch(_){msg('loginMsg','Browser storage is unavailable. Allow site storage if you want this device to remember your sign-in.');return null}}
function saveSession(){if(!token||!profile)return false;try{localStorage.setItem(SESSION_KEY,JSON.stringify({token:token,profile:profile}));localStorage.removeItem('rushabhWorkdaySessionV1');return true}catch(_){msg('loginMsg','This browser is blocking saved sign-in. Allow site storage and sign in again.');return false}}
function markSessionActivity(){/* Session persists until the employee explicitly signs out. */}
function startSessionTracking(){if(!activityBound){window.addEventListener('storage',e=>{if(e.key===SESSION_KEY&&!e.newValue&&token)signOutSession('You signed out in another tab.',false)});document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){checkSession();refreshAllData()}});activityBound=true}if(idleTimer)clearInterval(idleTimer);idleTimer=setInterval(checkSession,10*60*1000);if(refreshTimer)clearInterval(refreshTimer);refreshTimer=setInterval(refreshAllData,10*60*1000)}
async function checkSession(){if(!token)return;try{const wasManager=!!(ctx&&ctx.manager),wasCommerce=!!(ctx&&ctx.commerce);ctx=await rpc('appGetContext',token);lastServerPing=Date.now();$('sessionStatus').textContent='Signed in · updates refresh every 5 minutes.';if((ctx.manager&&!wasManager)||(ctx.commerce&&!wasCommerce))await enterApp();else if(wasCommerce&&!ctx.commerce){$('commerceTab').classList.add('hidden');if(document.querySelector('.tab[data-view="commerce"]')?.classList.contains('active'))showView('home')}}catch(e){const text=String(e&&e.message||'');if(/session expired|account is no longer active|sign in again/i.test(text)){await signOutSession('Your sign-in is no longer valid. Please sign in again.',false);return}$('sessionStatus').textContent='Connection paused · still signed in. Reconnecting…'}}
async function refreshAllData(){if(!token||refreshBusy||document.visibilityState==='hidden')return;refreshBusy=true;try{const jobs=[refreshMine,refreshAmcOptions,refreshMyAmc,refreshMySchedule,refreshMyTasks,refreshMyRequests];if(ctx&&ctx.manager)jobs.push(refreshDashboard,refreshTeamSchedules,refreshRequests,refreshWeeklyReport,refreshManagerAmcReports,refreshEmployeeDetail);if(ctx&&ctx.commerce)jobs.push(refreshCommerce);const results=await Promise.allSettled(jobs.map(fn=>Promise.resolve().then(fn)));const failed=results.some(r=>r.status==='rejected');$('sessionStatus').textContent=failed?'Signed in · some data could not refresh. Retrying in 10 minutes.':'Signed in · last synced '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});lastServerPing=Date.now()}finally{refreshBusy=false}}
async function signOutSession(message,callServer=true){const old=token;token='';profile=null;ctx=null;try{localStorage.removeItem(SESSION_KEY)}catch(_){}if(idleTimer){clearInterval(idleTimer);idleTimer=null}if(refreshTimer){clearInterval(refreshTimer);refreshTimer=null}if(callServer&&old){try{await rpc('appLogout',old)}catch(_){}}$('workspace').classList.add('hidden');$('login').classList.remove('hidden');$('otpWrap').classList.add('hidden');$('loginBtn').innerHTML='Send sign-in code <span>↗</span>';$('otp').value='';$('headRight').textContent='';if(message)msg('loginMsg',message)}
async function restoreSession(){const saved=readSession();if(!saved||!saved.token||!saved.profile)return;token=saved.token;profile=saved.profile;startSessionTracking();await enterApp();if(token)await refreshAllData()}
restoreSession();
function buddyMessage(text,kind){const node=document.createElement('div');node.className='buddyBubble '+kind;node.textContent=text;$('buddyMessages').appendChild(node);$('buddyMessages').scrollTop=$('buddyMessages').scrollHeight}
async function dayBuddyAnswer(question){const q=String(question||'').toLowerCase();if(/\b(other employee|another employee|coworker|co-worker|someone else's|team member|all employees)\b/.test(q))return 'I can only access your own records. Ask me about your attendance, schedule, tasks, or reports.';const data=await rpc('appGetMyData',token),today=data.today,attendance=data.attendance||[],reports=data.progress||[];if(/\b(schedule|shift|where.*work|assignment)\b/.test(q)){const rows=await rpc('appGetMySchedule',token);const upcoming=rows.filter(r=>String(r['Work Date']).slice(0,10)>=today).slice(0,5);return upcoming.length?upcoming.map(r=>`${r['Work Date']} · ${r['Start Time']}–${r['End Time']} · ${r['Shift / Assignment']}${r.Location?' · '+r.Location:''}`).join('\n'):'You have no upcoming shifts in your schedule.'}if(/\b(task|todo|to-do)\b/.test(q)){const rows=await rpc('appGetMyTasks',token),open=rows.filter(r=>r.Status!=='Completed');return open.length?open.slice(0,6).map(r=>`${r.Task} · ${r.Status} · due ${r['Due Date']}`).join('\n'):'You have no open assigned tasks.'}if(/\b(attendance|check.?in|check.?out|hours|present)\b/.test(q)){const rows=attendance.filter(r=>String(r['Work Date']).slice(0,10)===today);return rows.length?rows.map(r=>`${r.Event.replace('_',' ')} at ${r['Server Timestamp']} · location: ${r['Geofence Result']||'not recorded'}`).join('\n'):'You have no attendance entry today.'}if(/\b(report|worked|progress|blocker|week|yesterday)\b/.test(q)){let rows=reports.slice();if(/\byesterday\b/.test(q)){const d=new Date(today+'T12:00:00');d.setDate(d.getDate()-1);const key=d.toISOString().slice(0,10);rows=rows.filter(r=>String(r['Work Date']).slice(0,10)===key)}else if(/\b(today|tonight)\b/.test(q))rows=rows.filter(r=>String(r['Work Date']).slice(0,10)===today);else if(/\bweek\b/.test(q)){const d=new Date(today+'T12:00:00');d.setDate(d.getDate()-6);const from=d.toISOString().slice(0,10);rows=rows.filter(r=>String(r['Work Date']).slice(0,10)>=from&&String(r['Work Date']).slice(0,10)<=today)}return rows.length?rows.slice(0,7).map(r=>`${r['Work Date']} · ${r['Project / Client']||'Work'} · ${r.Status} · ${r.Hours}h\n${r['Work Summary']}${r.Blockers?'\nBlockers: '+r.Blockers:''}`).join('\n\n'):'I could not find a matching report in your recent 30-day history.'}return 'Try: “Show my schedule”, “What tasks are open?”, “Did I check in today?”, or “Summarize my report this week.”'}
$('buddyForm').onsubmit=async ev=>{ev.preventDefault();const input=$('buddyInput'),question=input.value.trim(),button=ev.submitter;if(!question)return;buddyMessage(question,'user');input.value='';button.disabled=true;try{const answer=await dayBuddyAnswer(question);buddyMessage(answer,'bot')}catch(e){buddyMessage('I could not load your records just now. Check your connection and try again.','bot')}finally{button.disabled=false;input.focus()}};
document.addEventListener('click',event=>{const button=event.target.closest('button');if(!button||button.disabled)return;button.classList.remove('tap-pulse');void button.offsetWidth;button.classList.add('tap-pulse');setTimeout(()=>button.classList.remove('tap-pulse'),420)});

// Explicit closeout dialog: checkout is initiated immediately, while the report
// and checkout are written together only after the employee submits the form.
function openReportDialog(forCheckout){
  const dialog=$('reportDialog');
  if(forCheckout){pendingCheckout=true;$('checkoutNotice').classList.remove('hidden');$('reportDialogEyebrow').textContent='CHECK-OUT REPORT';$('reportDialogTitle').textContent='Finish your day';$('reportForm').querySelector('button[type="submit"]').innerHTML='Save report & check out <span>↗</span>'}
  else{$('checkoutNotice').classList.add('hidden');$('reportDialogEyebrow').textContent='PROGRESS REPORT';$('reportDialogTitle').textContent='What did you work on today?';if(!pendingCheckout)$('reportForm').querySelector('button[type="submit"]').innerHTML='Save progress <span>↗</span>'}
  if(typeof dialog.showModal==='function'&&!dialog.open)dialog.showModal();else if(!dialog.open)dialog.setAttribute('open','');
  setTimeout(()=>$('reportForm').elements.summary.focus(),60);
}
$('closeReportDialog').onclick=()=>{const d=$('reportDialog');if(d.open&&d.close)d.close();else d.removeAttribute('open')};
$('newProgressReport').onclick=()=>openReportDialog(false);
$('reportForm').onsubmit=async ev=>{ev.preventDefault();const form=ev.currentTarget,b=form.querySelector('button[type="submit"]');if(!form.reportValidity())return;b.disabled=true;b.classList.add('is-busy');const d=Object.fromEntries(new FormData(form).entries());try{if(pendingCheckout){const p=pendingCheckoutLocation;await rpc('appSaveDailyReportAndCheckout',token,d,p?p.lat:'',p?p.lon:'',p?p.accuracy:'');pendingCheckout=false;pendingCheckoutLocation=null;await refreshMine();msg('reportMsg','Report saved and checkout recorded.');toast('Report saved · checked out')}else{await rpc('appSaveProgress',token,d);await refreshMine();msg('reportMsg','Progress saved.');toast('Progress report saved')}form.reset();$('closeReportDialog').click()}catch(e){msg('reportMsg',e.message||'The report could not be saved. Check your connection and retry.')}finally{b.disabled=false;b.classList.remove('is-busy')}};
// Replace the old time-windowed/inline behavior with the tested sequence.
punch=async function(kind){const b=$(kind==='CHECK_IN'?'inBtn':'outBtn');if(b.disabled)return;b.disabled=true;b.classList.add('is-busy');try{const pos=await optionalLocation();if(kind==='CHECK_IN'){await rpc('appPunch',token,'CHECK_IN',pos?pos.lat:'',pos?pos.lon:'',pos?pos.accuracy:'');pendingCheckout=false;pendingCheckoutLocation=null;await refreshMine();await refreshAmcOptions();await refreshMyAmc();await refreshMySchedule();showView('schedule');$('scheduleCheckinNotice').textContent='Checked in. Your manager’s assignment for today is shown below.';toast('Check-in saved · today’s assignment is open')}else{if(!myData||!myData.attendance.some(r=>String(r['Work Date']).slice(0,10)===myData.today&&r.Event==='CHECK_IN')){toast('Check in before checking out.');return}pendingCheckoutLocation=pos;showView('report');openReportDialog(true);toast(pos?'Complete the report to check out':'GPS skipped · complete the report to check out')}}catch(e){toast(e.message||'Attendance could not be saved. Try again.')}finally{b.disabled=false;b.classList.remove('is-busy')}};
$('inBtn').onclick=()=>punch('CHECK_IN');$('outBtn').onclick=()=>punch('CHECK_OUT');
$('reportDialog').addEventListener('cancel',()=>{if(pendingCheckout)pendingCheckout=true});
document.querySelectorAll('.tab[data-view]').forEach(b=>b.onclick=async()=>{showView(b.dataset.view);if(b.dataset.view==='schedule')await refreshMySchedule();if(b.dataset.view==='tasks')await refreshMyTasks();if(b.dataset.view==='requests')await refreshMyRequests();if(b.dataset.view==='report')openReportDialog(false);if(b.dataset.view==='amc'){await refreshMyAmc();$('amcForm').elements.visitNumber.focus()}if(b.dataset.view==='commerce'&&ctx&&ctx.commerce)await refreshCommerce()});

const AMC_BRANCHES=[['ANAND','1'],['KHAMBHAT','2'],['UMRETH','3'],['THASRA','4'],['PETLAD','5'],['MATAR','6'],['BORSAD','7'],['KAPADVANJ','8'],['BALASINOR','9'],['MAHEMDABAD','10'],['DAKOR','11'],['ATARSUMBA','12'],['VIRPUR','13'],['ANKLAV','14'],['NAVAGAM','15'],['MAHEDAV','16'],['V V NAGAR','17'],['CHAKLASHI','18'],['TARAPUR','19'],['LIMBASI','20'],['MAHIJ','21'],['MAHUDHA','22'],['AJARPURA','23'],['ALINA','24'],['NAR','25'],['SUNAV','26'],['KHAMBHODAJ','27'],['KATHLAL','28'],['CHIKHODRA','29'],['SARSA','30'],['BHADRAN','31'],['VASAD','32'],['UNDEL','33'],['KUNJRAV','34'],['VIRSAD','35'],['HALDHARVAS','36'],['RADHU','37'],['SAMARKHA','38'],['BHALEJ','39'],['BORIAVI','40'],['NAPAD','41'],['AKLACHA','42'],['KATHANA','43'],['PALANA','44'],['NESH','45'],['ALINDRA(M)','46'],['KHEDA','47'],['JETHOLI','48'],['AMUL DAIRY','49'],['ALINDRA(N)','50'],['BAMANGAM','51'],['SEVALIYA','52'],['MODAJ','53'],['LASUNDRA','54'],['SOJITRA','55'],['ANTISAR','56'],['AASHI','57'],['VANSOL','58'],['ZAROLA','59'],['KAVITHA','60'],['CHANGA','61'],['BANDHANI','62'],['TELNAR','63'],['PIPLAV','64'],['BHARODA','65'],['NADIAD HO(OLD)','66'],['SALAIYA','67'],['ODE','68'],['CHUNEL','69'],['KARAMSAD','70'],['MOGRI','71'],['GHADIYA','72'],['GUNJ BAZAR','73'],['NENPUR CHOKDI','74'],['PANDVA','75'],['CHARUSAT','76'],['ASODAR','77'],['RATANPUR','78'],['RAS','79'],['NARSANDA','80'],['CHHIPDI','81'],['THERMAL','82'],['KUMBHARWADI','83'],['DAVOL','84'],['DABHOU','85'],['GOLANA','86'],['BALOL','87'],['SANDHELI','88']];

  CCTV:['Dome / bullet cameras','NVR / DVR','PoE switch / power supply','Rack','LAN cables','Dust cleaned','Browser IP added in IE mode','Live view OK','Playback / recording OK','Date & time correct','Locker camera backup (days/months)','Other camera backup (days/months)'],

async function refreshAmcOptions(){try{const o=await rpc('appGetAmcOptions',token);$('amcEngineer').value=o.employee.name+' · '+o.employee.role;$('amcProduct').innerHTML=o.products.map(p=>`<option>${esc(p)}</option>`).join('');$('amcBranchList').innerHTML=o.branches.map(b=>`<option value="${esc(b.name)} · ${esc(b.code)}"></option>`).join('');$('amcDateTime').value=new Date().toLocaleString();renderAmcChecklist();}catch(e){msg('amcMsg',e.message)}}
function branchSelected(){const v=$('amcBranch').value.trim(),match=AMC_BRANCHES.find(b=>v.toUpperCase()===b[0]||v.toUpperCase()===b[0]+' · '+b[1]);if(match){$('amcBranch').value=match[0];$('amcBranchCode').value=match[1]}}
$('amcBranch').addEventListener('change',branchSelected);$('amcProduct').addEventListener('change',renderAmcChecklist);
function renderAmcChecklist(){const product=$('amcProduct').value||'CCTV',items=AMC_CHECKS[product]||AMC_CHECKS.Other;$('amcChecklist').innerHTML=`<h3>${esc(product)} physical inspection</h3><div class="amcCheckHead"><span>Item</span><span>Result</span><span>Remarks</span></div>`+items.map((name,i)=>`<div class="amcCheckRow"><strong>${esc(name)}</strong><select data-amc-status="${i}"><option>OK</option><option>Needs attention</option><option>Not applicable</option></select><input data-amc-note="${i}" maxlength="300" placeholder="Notes"></div>`).join('')}
function amcChecklistData(){return [...$('amcChecklist').querySelectorAll('[data-amc-status]')].map((s,i)=>({item:AMC_CHECKS[$('amcProduct').value][i],status:s.value==='OK'?'OK':s.value,notes:$('amcChecklist').querySelector(`[data-amc-note="${i}"]`).value.trim()}))}
function bindSignature(id){const c=$(id),ctx=c.getContext('2d');ctx.strokeStyle='#0b2018';ctx.lineWidth=4;ctx.lineCap='round';let drawing=false,marked=false;function point(e){const r=c.getBoundingClientRect();return [(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]}c.addEventListener('pointerdown',e=>{e.preventDefault();drawing=true;marked=true;c.setPointerCapture(e.pointerId);const p=point(e);ctx.beginPath();ctx.moveTo(p[0],p[1])});c.addEventListener('pointermove',e=>{if(!drawing)return;const p=point(e);ctx.lineTo(p[0],p[1]);ctx.stroke()});['pointerup','pointercancel','lostpointercapture'].forEach(n=>c.addEventListener(n,()=>drawing=false));c.clearSignature=()=>{ctx.clearRect(0,0,c.width,c.height);marked=false};c.hasSignature=()=>marked}
bindSignature('engineerSignature');bindSignature('managerSignature');document.querySelectorAll('.clearSignature').forEach(b=>b.onclick=()=>$(b.dataset.canvas).clearSignature());
$('amcStamp').addEventListener('change',()=>{const f=$('amcStamp').files[0];if(f){$('stampPreview').src=URL.createObjectURL(f);$('stampPreview').classList.remove('hidden')}});
function imageData(file,max=1000){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=()=>reject(Error('Could not read stamp photo.'));reader.onload=()=>{const image=new Image();image.onload=()=>{const scale=Math.min(1,max/Math.max(image.width,image.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(image.width*scale));canvas.height=Math.max(1,Math.round(image.height*scale));canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.7))};image.onerror=()=>reject(Error('Stamp photo could not be opened.'));image.src=reader.result};reader.readAsDataURL(file)})}
function pdfPreview(name,b64){const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0)),blob=new Blob([bytes],{type:'application/pdf'});if(window.amcPdfUrl)URL.revokeObjectURL(window.amcPdfUrl);window.amcPdfUrl=URL.createObjectURL(blob);$('amcPdfFrame').src=window.amcPdfUrl;$('amcPdfName').textContent=name;$('amcPreviewPanel').classList.remove('hidden');$('amcPreviewPanel').scrollIntoView({behavior:'smooth',block:'start'})}
$('printAmcPdf').onclick=()=>{try{$('amcPdfFrame').contentWindow.print()}catch(_){window.open(window.amcPdfUrl,'_blank')}};
async function refreshMyAmc(){if(!token)return;try{const rows=await rpc('appGetMyAmcReports',token);$('myAmcReports').innerHTML=rows.length?rows.map(r=>`<article class="record"><div><strong>${esc(r.Product)} · ${esc(r['Branch Name'])}</strong><span>${esc(r['Customer Name'])} · visit ${esc(r['AMC Visit'])} · ${esc(r['Server Timestamp'])}</span></div><button class="secondary" data-amc-open="${esc(r['Report ID'])}">Preview PDF</button></article>`).join(''):'<article class="record"><span>No AMC reports submitted yet.</span></article>';document.querySelectorAll('[data-amc-open]').forEach(b=>b.onclick=()=>openAmcPdf(b.dataset.amcOpen))}catch(e){$('myAmcReports').innerHTML=`<article class="record"><span>${esc(e.message)}</span></article>`}}
async function refreshManagerAmcReports(){if(!token||!ctx||!ctx.manager)return;try{const rows=await rpc('appManagerAmcReports',token);$('managerAmcReports').innerHTML=rows.length?rows.map(r=>`<article class="record"><div><strong>${esc(r.Product)} · ${esc(r['Branch Name'])} · ${esc(r['Employee Name'])}</strong><span>${esc(r['Customer Name'])} · visit ${esc(r['AMC Visit'])} · ${esc(r['Server Timestamp'])}</span></div><button class="secondary" data-amc-open="${esc(r['Report ID'])}">Open PDF</button></article>`).join(''):'<article class="record"><span>No team AMC reports yet.</span></article>';document.querySelectorAll('#managerAmcReports [data-amc-open]').forEach(b=>b.onclick=()=>openAmcPdf(b.dataset.amcOpen))}catch(e){$('managerAmcReports').innerHTML=`<article class="record"><span>${esc(e.message)}</span></article>`}}
async function openAmcPdf(id){try{const r=await rpc('appGetAmcPdf',token,id);showView('amc');pdfPreview(r.fileName,r.pdfBase64)}catch(e){toast(e.message||'Could not open that AMC PDF.')}}
$('refreshMyAmc').onclick=refreshMyAmc;$('refreshManagerAmc').onclick=refreshManagerAmcReports;
$('amcForm').onsubmit=async ev=>{ev.preventDefault();const f=ev.currentTarget,b=$('saveAmc');if(!f.reportValidity())return;if(!$('engineerSignature').hasSignature()){msg('amcMsg','Please sign the engineer signature box.');return}const stamp=$('amcStamp').files[0];if(!$('managerSignature').hasSignature()){msg('amcMsg','Please have the branch manager / customer representative sign the second box.');return}if(!stamp){msg('amcMsg','Take or choose a photo of the branch stamp.');return}b.disabled=true;b.classList.add('is-busy');msg('amcMsg','Preparing signed AMC PDF and saving it to company Drive…');try{const x=Object.fromEntries(new FormData(f).entries()),managerSig=$('managerSignature').hasSignature()?$('managerSignature').toDataURL('image/png'):'';let pos=null;if($('amcLocation').checked)pos=await optionalLocation();const result=await rpc('appSaveAmcReport',token,{branchName:$('amcBranch').value,branchCode:$('amcBranchCode').value,customerName:x.customerName,contact:x.contact,visitNumber:x.visitNumber,product:x.product,address:x.address,data:{checks:amcChecklistData(),ipv4:x.ipv4,hostAddress:x.hostAddress,dataStatus:x.dataStatus,newEnrollment:x.newEnrollment,issues:x.issues,miscellaneous:x.miscellaneous,nextMaterial:x.nextMaterial,managerName:x.managerName},engineerSignature:$('engineerSignature').toDataURL('image/png'),managerSignature:managerSig,stampPhoto:await imageData(stamp),latitude:pos?pos.lat:'',longitude:pos?pos.lon:'',accuracy:pos?pos.accuracy:''});pdfPreview(result.fileName,result.pdfBase64);msg('amcMsg','AMC report saved to Drive. Preview it below, then print when ready.');f.reset();$('engineerSignature').clearSignature();$('managerSignature').clearSignature();$('stampPreview').classList.add('hidden');await refreshMyAmc();if(ctx&&ctx.manager)await refreshManagerAmcReports();toast('AMC report saved as PDF')}catch(e){msg('amcMsg',e.message||'AMC report could not be generated.')}finally{b.disabled=false;b.classList.remove('is-busy')}};
