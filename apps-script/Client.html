function translateNode(node){if(!node||node.nodeType!==Node.TEXT_NODE)return;const current=node.nodeValue;if(!node.__workdayEnglish)node.__workdayEnglish=current;const base=node.__workdayEnglish,trimmed=base.trim();if(!trimmed)return;const localized=translate(trimmed);node.nodeValue=base.replace(trimmed,localized)}
function translateUI(root=document.body){document.body.lang=activeLanguage;const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while(n=walker.nextNode())translateNode(n);const elements=[];if(root.nodeType===Node.ELEMENT_NODE&&root.matches('[placeholder],[aria-label]'))elements.push(root);if(root.querySelectorAll)elements.push(...root.querySelectorAll('[placeholder],[aria-label]'));elements.forEach(el=>['placeholder','aria-label','title'].forEach(attr=>{const key=attr==='aria-label'?'workdayAriaLabel':attr==='title'?'workdayTitle':'workdayPlaceholder';if(!el.dataset[key])el.dataset[key]=el.getAttribute(attr)||'';el.setAttribute(attr,translate(el.dataset[key]))}));const picker=$('languageSelect');if(picker&&picker.value!==activeLanguage)picker.value=activeLanguage}

  if(forCheckout){pendingCheckout=true;$('checkoutNotice').classList.remove('hidden');$('reportDialogEyebrow').textContent='CHECK-OUT REPORT';$('reportDialogTitle').textContent='Finish your day';$('reportForm').querySelector('button[type="submit"]').innerHTML='Save report & check out <span>↗</span>'}
  else{$('checkoutNotice').classList.add('hidden');$('reportDialogEyebrow').textContent='PROGRESS REPORT';$('reportDialogTitle').textContent='What did you work on today?';if(!pendingCheckout)$('reportForm').querySelector('button[type="submit"]').innerHTML='Save progress <span>↗</span>'}
  if(typeof dialog.showModal==='function'&&!dialog.open)dialog.showModal();else if(!dialog.open)dialog.setAttribute('open','');
  setTimeout(()=>$('reportForm').elements.summary.focus(),60);
}
function applyAttendanceState(data){const state=data&&data.todayAttendance||{},today=data&&data.today||'',rows=(data&&data.attendance||[]).filter(r=>String(r['Work Date']).slice(0,10)===today),i=state.checkIn||rows.find(r=>r.Event==='CHECK_IN')||null,o=state.checkOut||rows.find(r=>r.Event==='CHECK_OUT')||null;$('attendanceState').textContent=o?'Day complete':i?'Checked in':'Not checked in';$('inTime').textContent=i?'Recorded '+(i['Server Timestamp']||''):'';$('outTime').textContent=o?'Recorded '+(o['Server Timestamp']||''):'';$('inBtn').disabled=!!i;$('outBtn').disabled=!i||!!o}

async function refreshAmcOptions(){try{const o=await rpc('appGetAmcOptions',token);amcClients=o.clients||[];$('amcEngineer').value=o.employee.name+' · '+o.employee.role;const selected=selectedAmcProducts(),productOptions=Array.isArray(o.products)&&o.products.length?o.products:Object.keys(AMC_CHECKS);$('amcProductChoices').innerHTML=productOptions.map(p=>`<label class="amcProductChoice"><input type="checkbox" name="amcProducts" value="${esc(p)}" ${selected.includes(p)?'checked':''}><span>${esc(p)}</span></label>`).join('');if($('amcReminderProduct'))$('amcReminderProduct').innerHTML=o.products.map(p=>`<option value="${esc(p)}">${esc(p)}</option>`).join('');$('amcBranchList').innerHTML=o.branches.map(b=>`<option value="${esc(b.name)} · ${esc(b.code)}"></option>`).join('');if($('amcClientSelect'))$('amcClientSelect').innerHTML='<option value="">Choose saved client or enter below…</option>'+(o.clients||[]).map(c=>`<option value="${esc(c.id)}">${esc(c.name)} · ${esc(c.branchName)}</option>`).join('');$('amcDateTime').value=new Date().toLocaleString();updateAmcProductFields();renderAmcChecklist();}catch(e){msg('amcMsg',e.message)}}

function bindSignature(id){
  const c=$(id),drawCtx=c.getContext('2d'),status=document.querySelector('[data-signature-status=\"'+id+'\"]');let activePointer=null,strokes=[],activeStroke=null;
  drawCtx.strokeStyle='#0b2018';drawCtx.fillStyle='#0b2018';drawCtx.lineWidth=5;drawCtx.lineCap='round';drawCtx.lineJoin='round';
  function point(e){const r=c.getBoundingClientRect();return{x:Math.max(0,Math.min(1,(e.clientX-r.left)/Math.max(1,r.width))),y:Math.max(0,Math.min(1,(e.clientY-r.top)/Math.max(1,r.height)))}}
  function redraw(){drawCtx.clearRect(0,0,c.width,c.height);strokes.forEach(stroke=>{if(!stroke.length)return;const first=stroke[0],x=first.x*c.width,y=first.y*c.height;if(stroke.length===1){drawCtx.beginPath();drawCtx.arc(x,y,drawCtx.lineWidth/2,0,Math.PI*2);drawCtx.fill();return}drawCtx.beginPath();drawCtx.moveTo(x,y);for(let i=1;i<stroke.length;i++)drawCtx.lineTo(stroke[i].x*c.width,stroke[i].y*c.height);drawCtx.stroke()})}
  function say(text){if(status)status.textContent=text}
  function begin(e){if(e.button!==undefined&&e.button!==0)return;e.preventDefault();activePointer=e.pointerId??'touch';activeStroke=[];strokes.push(activeStroke);activeStroke.push(point(e));redraw();if(e.pointerId!==undefined&&c.setPointerCapture)try{c.setPointerCapture(e.pointerId)}catch(_){}say('Signature captured. Draw again to add to it.')}
  function move(e){if(activePointer===null||(e.pointerId!==undefined&&e.pointerId!==activePointer))return;e.preventDefault();const samples=e.getCoalescedEvents?e.getCoalescedEvents():[e];samples.forEach(sample=>activeStroke.push(point(sample)));redraw()}
  function end(e){if(activePointer===null||(e&&e.pointerId!==undefined&&e.pointerId!==activePointer))return;if(activeStroke&&activeStroke.length){redraw();say('Signature captured. It stays until you clear it or save the report.')}activePointer=null;activeStroke=null}
  if(window.PointerEvent){c.addEventListener('pointerdown',begin);c.addEventListener('pointermove',move);['pointerup','pointercancel','lostpointercapture'].forEach(name=>c.addEventListener(name,end))}
  else{c.addEventListener('touchstart',e=>{const t=e.changedTouches[0];if(t)begin({clientX:t.clientX,clientY:t.clientY,preventDefault:()=>e.preventDefault(),pointerId:'touch'})},{passive:false});c.addEventListener('touchmove',e=>{const t=e.changedTouches[0];if(t)move({clientX:t.clientX,clientY:t.clientY,preventDefault:()=>e.preventDefault(),pointerId:'touch'})},{passive:false});['touchend','touchcancel'].forEach(name=>c.addEventListener(name,end));c.addEventListener('mousedown',e=>begin(e));c.addEventListener('mousemove',move);['mouseup','mouseleave'].forEach(name=>c.addEventListener(name,end))}
  c.clearSignature=()=>{activePointer=null;activeStroke=null;strokes=[];redraw();say('Signature cleared. Sign inside the box.')};c.hasSignature=()=>strokes.some(stroke=>stroke.length>0);c.signatureData=()=>c.hasSignature()?c.toDataURL('image/png'):'';say('Sign inside the box. Your signature stays until you clear it or save the report.')
}

function imageData(file,max=1000){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=()=>reject(Error('Could not read stamp photo.'));reader.onload=()=>{const image=new Image();image.onload=()=>{const scale=Math.min(1,max/Math.max(image.width,image.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(image.width*scale));canvas.height=Math.max(1,Math.round(image.height*scale));canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.7))};image.onerror=()=>reject(Error('Stamp photo could not be opened.'));image.src=reader.result};reader.readAsDataURL(file)})}
function pdfPreview(name,b64){const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));if(bytes.length<5||String.fromCharCode(...bytes.slice(0,5))!=='%PDF-')throw Error('The saved file is not a valid PDF. Reopen the report or save it again.');const blob=new Blob([bytes],{type:'application/pdf'});if(window.amcPdfUrl)URL.revokeObjectURL(window.amcPdfUrl);window.amcPdfUrl=URL.createObjectURL(blob);$('amcPdfFrame').src=window.amcPdfUrl;$('amcPdfName').textContent=name;$('openAmcPdf').href=window.amcPdfUrl;$('downloadAmcPdf').href=window.amcPdfUrl;$('downloadAmcPdf').download=name||'AMC-report.pdf';$('amcPreviewPanel').classList.remove('hidden');$('amcPreviewPanel').scrollIntoView({behavior:'smooth',block:'start'})}

anguage;updateAmcProductFields();renderAmcChecklist();$('engineerSignature').clearSignature();$('managerSignature').clearSignature();$('stampPreview').classList.add('hidden');await refreshMyAmc();if(ctx&&ctx.manager)await refreshManagerAmcReports();toast('AMC report saved as PDF')}catch(e){msg('amcMsg',e.message||'AMC report could not be generated.')}finally{b.disabled=false;b.classList.remove('is-busy')}};
